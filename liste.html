<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Umzug Dashboard</title>
<meta name="theme-color" content="#e9ebea"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23e9ebea'/><text x='6' y='24' font-size='22' font-family='Arial' font-weight='700' fill='%231d1f20'>U</text><circle cx='25' cy='22' r='3' fill='%23e34a2f'/></svg>">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

</head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: Edelstahl-Kopfleiste mit Bereichen, helle Arbeitsfläche. Galerie-Farben codieren die Entscheidung pro Möbel, Eiche = Priorität 2, Rot = dringend. Immer hell. */
:root{
  --wall:#f7f7f5;--paper:#fff;--ink:#1d1f20;--mute:#666b6e;--line:#e2e2dd;--line2:#cdd0ce;
  --steel1:#e3e6e7;--steel2:#bcc2c5;--oak:#c7955c;--red:#d9412a;--warn:#e0861a;--ok:#2f7a45;
  --kaufen:#2747c9;--verkaufen:#e23d28;--aufarbeiten:#f08422;--fest:#f2c230;--mitnehmen:#c7955c;--uebernehmen:#8fa08a;--offen:#b9a7d6;--verschenken:#e88aa6;--nachmieter:#4f7f8c;--entsorgen:#9a9d9f;
  --plan-floor:#efe6d6;--plan-wall:#2a2d2e;--plan-door:#8a8f92;--plan-win:#7fb0d8;
  --f-body:"Schibsted Grotesk",system-ui,sans-serif;--f-display:"Bricolage Grotesque","Schibsted Grotesk",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 12px 24px -18px rgba(0,0,0,.35);
  color-scheme:light;
}
html,body{background:var(--wall)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--kaufen);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.steel{background:repeating-linear-gradient(90deg,rgba(255,255,255,.3) 0 1px,transparent 1px 3px),linear-gradient(180deg,var(--steel1),var(--steel2))}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid var(--line2)}
.bar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap;padding-block:10px}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:-.01em}
.logo i{font-style:normal;color:var(--red)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.tabs button{background:none;border:0;padding:8px 10px;opacity:.75;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{opacity:1;font-weight:700;border-bottom-color:var(--red)}
.cd{font-family:var(--f-mono);font-size:.82rem;white-space:nowrap}
.cd b{font-size:1.1rem;color:var(--red)}
.mode{font-size:.75rem;padding:4px 10px;background:var(--paper);border:1px solid var(--line2);border-radius:999px;color:var(--mute)}

main{max-width:1240px;margin:0 auto;padding-block:22px 64px;display:grid;gap:20px}
.vh{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.vh h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,3.4vw,2.4rem);letter-spacing:-.02em;line-height:1}
.lbl{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.hint{font-size:.8rem;color:var(--mute)}
.btn{border:1px solid var(--ink);background:var(--paper);padding:7px 12px;border-radius:3px;font-weight:600;font-size:.85rem;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--wall)}
.btn.ghost{border-color:var(--line2)}
.btn.small{padding:4px 9px;font-size:.78rem}
.btn.danger{border-color:var(--red);color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line2);background:var(--paper);padding:5px 11px;border-radius:999px;font-size:.82rem;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.sq{width:11px;height:11px;display:inline-block;flex:0 0 auto;border-radius:2px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.panel>h2{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.empty{color:var(--mute);font-size:.88rem}
.g12{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.pill{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p1{background:var(--red);color:#fff}.p2{background:var(--oak);color:#fff}.p3{background:var(--line);color:var(--mute)}
.dec{font-size:.7rem;font-weight:700;padding:2px 7px;color:#fff;white-space:nowrap}
.dec.dk{color:var(--ink)}
.tagm{font-size:.72rem;padding:1px 7px;border:1px solid var(--line2);border-radius:999px;color:var(--mute);white-space:nowrap}
input.inl,select.inl{border:1px solid var(--line2);background:var(--wall);padding:4px 7px;border-radius:3px;font-size:.8rem}

/* Heute */
.hero{padding:18px;border-radius:4px;border:1px solid var(--line2);display:grid;align-content:space-between;gap:10px;min-height:190px}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(4rem,9vw,6rem);line-height:.85;letter-spacing:-.04em;color:var(--red)}
.quick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px}
.quick input,.quick select{border:1px solid var(--line2);background:var(--wall);padding:8px 10px;border-radius:3px;min-width:0}
.ag{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ag:last-child{border-bottom:0}
.dt{font-family:var(--f-mono);text-align:center;line-height:1.1;border:1px solid var(--line2);padding:4px 0;border-radius:3px;font-size:.72rem;background:var(--wall)}
.dt b{display:block;font-size:1.05rem}
.dt.late{border-color:var(--red);color:var(--red)}
.ag b{font-weight:600}
.ag small{display:block;color:var(--mute)}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.pipe div{border-top:3px solid var(--verkaufen);padding-top:6px;display:grid}
.pipe b{font-family:var(--f-display);font-weight:800;font-size:1.8rem;line-height:1}
.pipe span{font-size:.75rem;color:var(--mute)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat button{background:var(--wall);border:1px solid var(--line);padding:10px;border-radius:3px;text-align:left;display:grid}
.stat b{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1}
.stat span{font-size:.75rem;color:var(--mute)}

/* Wohnung */
.proto{background:var(--paper);border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.pbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2)}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:.84rem;padding:4px 10px;border:1px solid var(--line2);border-radius:999px;background:var(--paper)}
.tog[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pbody{display:grid;grid-template-columns:minmax(0,1fr) 320px}
.stage{background:#fbfaf7;min-width:0;touch-action:none;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:80vh;user-select:none;-webkit-user-select:none}
.side{border-left:1px solid var(--line);padding:14px;display:grid;gap:14px;align-content:start;min-width:0}
.side h4{font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.85rem}
.kv>span:nth-child(odd){color:var(--mute)}
.warns{display:grid;gap:6px}
.w{font-size:.82rem;padding:6px 9px;border-radius:3px;background:#fdeae6;color:#8f2a1a}
.w.o{background:#fdf0dc;color:#7a4a07}
.w.g{background:#e7f2ea;color:#1f5a33}
.tlist{display:grid}
.tlist label{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:.86rem;padding:5px 0;border-bottom:1px solid var(--line)}
.tlist input{accent-color:var(--ink);margin-top:3px}
.tlist .done span{text-decoration:line-through;color:var(--mute)}
.tray{display:grid}
.ti{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.84rem;padding:5px 0;border-bottom:1px solid var(--line)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos button{padding:0;border:1px solid var(--line);aspect-ratio:3/4;background:var(--wall) center/cover no-repeat}
.dimrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dimrow label{display:grid;gap:2px;font-size:.75rem;color:var(--mute);font-weight:700}
.dimrow input,.dimrow select{border:1px solid var(--line2);background:var(--wall);padding:6px 8px;border-radius:3px;width:100%;box-sizing:border-box;font-weight:400;color:var(--ink)}
.opening{display:grid;grid-template-columns:1fr 64px 64px 28px;gap:6px;align-items:center;font-size:.8rem}
.opening select,.opening input{border:1px solid var(--line2);background:var(--wall);padding:4px 5px;border-radius:3px;width:100%;box-sizing:border-box}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--mute);padding:8px 14px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.room-floor{fill:var(--plan-floor)}
.room-floor.out{fill:#e6ebe2}
.room-floor.sel{fill:#f7eedb}
.room-name{font-family:var(--f-display);font-weight:800;fill:#3a3530;font-size:19px}
.room-dim{font-family:var(--f-mono);fill:#8a8073;font-size:11px}
.wall{fill:none;stroke:var(--plan-wall);stroke-width:8}
.door{fill:none;stroke:var(--plan-door);stroke-width:1.5;stroke-dasharray:4 3}
.win{stroke:var(--plan-win);stroke-width:8}
.fixed rect{fill:#dfe3e5;stroke:#9aa1a5;stroke-width:1.5}
.fixed text{font-size:10px;fill:#5d6467}
.pc{cursor:grab}
.pc .shape{stroke:#1d1f20;stroke-width:1.5;fill-opacity:.9}
.pc.sel .shape{stroke-width:4}
.pc.bad .shape{stroke:var(--red);stroke-width:4;stroke-dasharray:8 5}
.pc text{font-size:12px;font-weight:700;fill:#fff;pointer-events:none}
.pc text.dk{fill:#1d1f20}
.pc text.dim{font-weight:400;font-family:var(--f-mono);font-size:10px}
.gap line{stroke:var(--warn);stroke-width:1.5}
.gap rect{fill:#fff;stroke:var(--warn)}
.gap text{font-family:var(--f-mono);font-size:11px;fill:#7a4a07}
.clear{fill:var(--red);fill-opacity:.08}
.pin circle{fill:var(--ink)}
.pin text{fill:#fff;font-family:var(--f-mono);font-size:13px}
.cam circle{fill:#fff;stroke:var(--ink);stroke-width:1.5}
.handle{fill:var(--kaufen);stroke:#fff;stroke-width:2;cursor:nwse-resize}
.rmove{cursor:move}
.elev text{font-size:15px;fill:var(--ink)}

/* Möbel */
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:8px 58px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px 12px 8px 0;overflow:hidden}
.item .stripe{align-self:stretch;margin:-8px 0}
.thumb{width:58px;height:58px;background:var(--wall) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center}
.item .name{font-weight:700;font-size:.98rem;background:none;border:0;padding:0;text-align:left}
.item .name:hover{text-decoration:underline}
.meta{color:var(--mute);font-size:.8rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.item .right{display:grid;gap:6px;justify-items:end}
.item.done{opacity:.6}
.groups{display:grid;gap:22px}
.group h3{font-size:.95rem;display:flex;gap:8px;align-items:center;margin-bottom:8px}
a.ext{color:var(--kaufen);font-size:.8rem}

/* Plan */
.week{display:grid;gap:4px}
.week h3{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:6px 0;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between}
.week.late h3{color:var(--red);border-color:var(--red)}
.week.move h3{color:var(--kaufen);border-color:var(--kaufen)}
.task{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line)}
.task input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--ink)}
.task .tt{background:none;border:0;padding:0;text-align:left;font-weight:500}
.task.done .tt{text-decoration:line-through;color:var(--mute)}
.task .meta{margin-top:2px}
.due{font-family:var(--f-mono);font-size:.75rem;color:var(--mute);white-space:nowrap}
.due.late{color:var(--red)}
.evrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.evrow .dot{width:12px;height:12px;border-radius:50%;background:var(--kaufen);margin-left:3px}

/* Geld */
.money{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:baseline}
.money .num{text-align:right}
.money .tot{border-top:2px solid var(--ink);padding-top:6px;font-weight:700}
.money .sub{color:var(--mute);font-size:.82rem;padding-left:12px}

/* Ideen */
.ideas{columns:4 220px;column-gap:14px}
.idea{break-inside:avoid;margin-bottom:14px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;display:grid}
.idea img{width:100%;display:block}
.idea .ib{padding:10px 12px;display:grid;gap:4px}
.idea .ib p{color:var(--mute);font-size:.85rem;white-space:pre-wrap}

/* Overlays */
.scrim{position:fixed;inset:0;background:rgba(15,17,18,.45);z-index:20;display:grid;place-items:center;padding:16px}
.sheet{background:var(--paper);width:min(600px,100%);max-height:calc(100% - 32px);overflow:auto;border-radius:6px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);display:grid}
.sheet header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:var(--paper);z-index:1}
.sheet header h3{font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.sheet form{padding:16px 18px 18px;display:grid;gap:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fld{display:grid;gap:4px;min-width:0}
.fld>label{font-size:.75rem;font-weight:700;color:var(--mute)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line2);background:var(--wall);padding:8px 10px;border-radius:3px;width:100%;box-sizing:border-box}
.fld textarea{min-height:64px;resize:vertical}
.drop{border:1.5px dashed var(--line2);border-radius:4px;padding:10px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;background:var(--wall)}
.drop.over{border-color:var(--kaufen)}
.drop .thumb{width:72px;height:72px}
.formacts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lightbox{position:fixed;inset:0;background:rgba(10,10,10,.88);z-index:25;display:grid;grid-template-rows:auto 1fr auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
.lightbox img{max-width:100%;max-height:100%;margin:auto;display:block;object-fit:contain;min-height:0}
.lightbox .lbbar{display:flex;justify-content:space-between;align-items:center;color:#fff;gap:10px}
.lightbox .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--wall);padding:9px 16px;border-radius:999px;font-size:.85rem;z-index:30}

@media (max-width:980px){.c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}.pbody{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line)}}
@media (max-width:520px){
  .item{grid-template-columns:6px 48px minmax(0,1fr)}.item .thumb{width:48px;height:48px}
  .item .right{grid-column:3;justify-items:start;grid-auto-flow:column;justify-content:start;gap:10px}
  .f2,.f3{grid-template-columns:1fr}.cd{display:none}.quick{grid-template-columns:1fr}
}
</style>

<div class="bar steel"><div class="bar-in gut">
  <div class="logo">Umzug<i>.</i></div><a href="./" style="font:500 14px var(--f-sans,inherit);color:inherit;text-decoration:none;border:1px solid currentColor;border-radius:999px;padding:3px 10px;opacity:.75">zur Tafel</a>
  <nav class="tabs" role="tablist" aria-label="Bereiche" id="tabs"></nav>
  <div class="cd" id="cd"></div>
  <span class="mode" id="mode" hidden></span>
</div></div>
<main class="gut" id="view"><p class="empty">Dashboard wird geladen …</p></main>
<div id="modal"></div>
<div id="lb"></div>
<div id="toast" class="toast" hidden></div>

}
function dbBackend(db){

  db.doc("meta/settings").onSnapshot(function(d){if(d.exists)S.meta=Object.assign({moveDate:"2026-12-15"},d.data());schedule()},function(){});
  db.doc("meta/plan").onSnapshot(function(d){if(d.exists)S.plan=Object.assign({doors:[],windows:[],fixed:[]},d.data());schedule()},function(){});
  function fail(e){if(e&&e.code==="invalid_argument"){readOnly=true;toast("Du kannst hier nur lesen.");render()}else if(e&&e.code==="quota_exceeded"){toast("Speicher voll. Bitte Bilder oder alte Einträge löschen.")}else toast("Speichern hat nicht geklappt. Bitte nochmal versuchen.");throw e}
  return {kind:"db",
    save:function(c,id,data){return db.collection(c).doc(id).set(data).catch(fail)},
    hard:function(c,id){return db.collection(c).doc(id).delete().catch(fail)},
    saveDoc:function(k,data){return db.doc(k==="meta"?"meta/settings":"meta/plan").set(data).catch(fail)},
    newId:function(c){return db.collection(c).doc().id}};
}
function sbBackend(sb,rows){
  COLLS.forEach(function(c){S[c]={}});
  function apply(r){if(!r||!r.coll)return;if(r.coll==="meta"){if(r.id==="settings")S.meta=Object.assign({moveDate:"2026-12-15"},r.data);if(r.id==="plan")S.plan=Object.assign({doors:[],windows:[],fixed:[]},r.data)}else if(S[r.coll])S[r.coll][r.id]=r.data}
  rows.forEach(apply);
  sb.channel("docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},function(p){if(p.eventType==="DELETE"){var o=p.old||{};if(o.coll&&S[o.coll]&&o.coll!=="meta")delete S[o.coll][o.id]}else apply(p.new);schedule()}).subscribe();
  function chk(res){if(res.error){toast("Speichern hat nicht geklappt. Bitte nochmal versuchen.");throw res.error}}
  function up(c,id,data){return sb.from("docs").upsert({coll:c,id:id,data:data,updated_at:new Date().toISOString()}).then(chk)}
  return {kind:"supabase",
    save:function(c,id,data){S[c][id]=data;schedule();return up(c,id,data)},
    hard:function(c,id){delete S[c][id];schedule();return sb.from("docs").delete().eq("coll",c).eq("id",id).then(chk)},
    saveDoc:function(k,data){S[k]=data;schedule();return up("meta",k==="meta"?"settings":"plan",data)}};
}

function gcal(e){var p=pd(e.date);if(!p)return "#";var ds,f=function(d){return iso(d).replace(/-/g,"")+"T"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"00"};
  if(e.time&&/^\d{1,2}:\d{2}$/.test(e.time)){var hm=e.time.split(":"),s=new Date(p);s.setHours(+hm[0],+hm[1]);ds=f(s)+"/"+f(new Date(s.getTime()+(num(e.dauer)||60)*6e4))}
  else{var n=new Date(p);n.setDate(n.getDate()+1);ds=iso(p).replace(/-/g,"")+"/"+iso(n).replace(/-/g,"")}
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(e.title||"")+"&dates="+ds+"&details="+encodeURIComponent((e.notiz||"")+"\n(aus dem Umzugs-Dashboard)")+"&location="+encodeURIComponent(e.ort||"")}
function offer(name,text,type){if(!downloads&&!window.claude){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);toast("Datei wird heruntergeladen");return}if(downloads){downloads.save({filename:name,data:new Blob([text],{type:type})}).then(function(){toast("Datei bereit")}).catch(function(err){if(!(err&&err.code==="declined"))showOut(text)})}else showOut(text)}
function showOut(text){if(UI.tab!=="daten"){UI.tab="daten";render()}var o=$("#exp-out");if(o){o.innerHTML='<p class="hint">Herunterladen geht hier nicht. Kopiere den Inhalt in eine Datei.</p><textarea readonly style="width:100%;min-height:120px;font-family:var(--f-mono);font-size:.7rem"></textarea>';o.querySelector("textarea").value=text;o.querySelector("textarea").select()}}

function doIcs(){var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Umzug Dashboard//DE"],ic=function(s){return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;")},f=function(d){return iso(d).replace(/-/g,"")+"T"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"00"};
  live("events").forEach(function(e){var p=pd(e.date);if(!p)return;L.push("BEGIN:VEVENT","UID:"+e.id+"@umzug","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z");
    if(e.time&&/^\d{1,2}:\d{2}$/.test(e.time)){var hm=e.time.split(":"),s=new Date(p);s.setHours(+hm[0],+hm[1]);L.push("DTSTART:"+f(s),"DTEND:"+f(new Date(s.getTime()+(num(e.dauer)||60)*6e4)))}else{var n=new Date(p);n.setDate(n.getDate()+1);L.push("DTSTART;VALUE=DATE:"+iso(p).replace(/-/g,""),"DTEND;VALUE=DATE:"+iso(n).replace(/-/g,""))}
    L.push("SUMMARY:"+ic(e.title));if(e.ort)L.push("LOCATION:"+ic(e.ort));if(e.notiz)L.push("DESCRIPTION:"+ic(e.notiz));L.push("END:VEVENT")});L.push("END:VCALENDAR");offer("umzug-termine.ics",L.join("\r\n"),"text/calendar")}
function doImport(file){if(readOnly){toast("Du kannst hier nur lesen.");return}var r=new FileReader();r.onload=function(){var d;try{d=JSON.parse(r.result)}catch(e){toast("Die Datei ist kein gültiger Export.");return}
  if(!d||!COLLS.some(function(c){return d[c]})){toast("In der Datei stehen keine Umzugsdaten.");return}var jobs=[];COLLS.forEach(function(c){Object.keys(d[c]||{}).forEach(function(id){jobs.push([c,id,d[c][id]])})});var i=0;
  (function next(){if(i>=jobs.length){if(d.meta)backend.saveDoc("meta",d.meta);if(d.plan)backend.saveDoc("plan",d.plan);toast(jobs.length+" Einträge importiert");return}var j=jobs[i++];backend.save(j[0],j[1],j[2]).then(next,next)})()};r.readAsText(file)}
