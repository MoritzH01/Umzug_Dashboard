<title>Umzug Canvas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Zwei Oberflächen für denselben Plan: Zeichentisch (Transparentpapier, Tusche) und Tafel (Schiefer, Kreide).
   Farben im Plan nach Bauantrag-Konvention: Bestand grau, Neu rot, Abbruch/geht weg gelb gestrichelt. */
:root{
  --bg:#f5f2ec;--grid1:rgba(35,64,200,.05);--grid2:rgba(35,64,200,.10);
  --ink:#1c2a4b;--ink2:#5b6580;--paper:#ffffff;--line:#dedbd2;
  --wall:#1c2a4b;--floor:#ffffff;--floor2:#f7f1e6;--hatch:#9a958a;
  --neu:#e34a2f;--abbruch:#e2b33a;--bestand:#6b7387;--blau:#2f4ee0;--orange:#f28c28;--eiche:#c8995f;
  --steel:linear-gradient(180deg,#f4f5f5,#dfe2e2 55%,#cfd3d3);
  --ui:#f1f2f2;--uiline:#b9bebe;--shadow:0 1px 0 rgba(0,0,0,.05),0 6px 18px rgba(40,35,20,.10);
  --hand:"Courier Prime","Courier New",monospace;--sans:"Inter Tight",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#board{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid1) 1px,transparent 1px),linear-gradient(90deg,var(--grid1) 1px,transparent 1px)}
#board.panning{cursor:grabbing}
#board,#board *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#board [contenteditable="true"],#board [contenteditable="true"] *{-webkit-user-select:text;user-select:text}
#board img{-webkit-user-drag:none}
.ui,#hint,#mini,#ftool{-webkit-user-select:none;user-select:none}
#hint{pointer-events:none}
#ftool{position:fixed;z-index:25;display:none;gap:2px;background:var(--ink);padding:4px;border-radius:10px;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);transform:translate(-50%,calc(-100% - 10px))}
#ftool.on{display:flex}
#ftool button{border:0;background:transparent;color:#fff;font:500 13px var(--sans);padding:6px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
#ftool button:hover{background:rgba(255,255,255,.14)}
#ftool b{color:#fff;font:600 12px var(--sans);padding:6px 8px 6px 6px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
body.moving #world{will-change:transform}
.el{position:absolute}
.sel{outline:2px solid var(--blau);outline-offset:3px}

/* Rahmen / Zonen */
.frame{border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 70%,transparent);border-radius:2px}
.fhead{position:absolute;left:-1px;top:-46px;height:42px;display:flex;align-items:baseline;gap:12px;padding:0 2px;background:none;color:var(--ink);font:700 30px var(--sans);letter-spacing:-.025em;text-transform:lowercase;cursor:move;white-space:nowrap;user-select:none}
.fhead small{font:400 13px var(--sans);color:var(--ink2);letter-spacing:0}
.fbody{position:absolute;inset:0;padding:18px;overflow:hidden}

/* Post-its */
.note{width:190px;min-height:170px;padding:18px 14px 14px;font:16px/1.3 var(--hand);color:#1c2a4b;letter-spacing:.01em;box-shadow:0 1px 1px rgba(0,0,0,.08),0 10px 18px -8px rgba(0,0,0,.35);cursor:move;user-select:none}
.note::before{content:"";position:absolute;left:50%;top:-9px;width:68px;height:20px;transform:translateX(-50%) rotate(-2deg);background:rgba(240,235,215,.75);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.note[contenteditable="true"]{cursor:text;user-select:text;outline:2px solid var(--blau)}
.n-gelb{background:#ffe066}.n-rosa{background:#ffadc7}.n-blau{background:#a8d4ff}.n-gruen{background:#bfe8a8}.n-orange{background:#ffb86b}.n-weiss{background:#fbfaf6}
.txt{font:700 36px/1.05 var(--sans);letter-spacing:-.03em;text-transform:lowercase;color:var(--ink);cursor:move;white-space:pre-wrap;min-width:60px;user-select:none}
.txt[contenteditable="true"]{cursor:text;user-select:text;outline:1px dashed var(--blau)}
.img{background:#fff;padding:10px 10px 34px;box-shadow:var(--shadow);cursor:move}
.img img{display:block;width:100%;height:calc(100% );object-fit:cover;pointer-events:none}
.img .cap{position:absolute;left:10px;right:10px;bottom:8px;font:13px var(--hand);color:#1c2a4b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;background:var(--blau);border:2px solid #fff;cursor:nwse-resize;display:none}
.sel .rs,.frame:hover>.rs{display:block}
.x{position:absolute;right:-12px;top:-12px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font:600 13px var(--sans);display:none;line-height:24px;padding:0}
.sel .x,.frame:hover>.x{display:block}

/* Planblatt */
.sheet{background:var(--paper);box-shadow:var(--shadow);border:1px solid var(--line)}
.sheet svg{position:absolute;overflow:visible}
.sheet .sheethead{position:absolute;left:0;right:0;top:-34px;height:34px;cursor:move}
.room-floor{fill:var(--floor);cursor:pointer;transition:fill .15s}
.room-floor:hover{fill:var(--floor2)}
.room-floor.out{fill:url(#out)}
.wall{fill:none;stroke:var(--wall);stroke-width:10;stroke-linejoin:miter}
.gap{stroke:var(--floor-solid,#fffdf8);stroke-width:14}
.swing{fill:none;stroke:var(--ink2);stroke-width:1;stroke-dasharray:4 3}
.leaf{stroke:var(--ink);stroke-width:2}
.win{stroke:var(--ink);stroke-width:1.2}
.fixed rect{fill:url(#hatch);stroke:var(--ink2);stroke-width:1}
.rlabel{font:700 16px var(--sans);letter-spacing:-.02em;fill:var(--ink);pointer-events:none}
.rsub{font:400 9px var(--mono);fill:var(--ink2);pointer-events:none}
.rbig{font:700 54px var(--sans);fill:var(--ink);pointer-events:none;letter-spacing:-.035em}
.rbig2{font:500 26px var(--mono);fill:var(--ink2);pointer-events:none}
.dim{stroke:var(--ink2);stroke-width:.8}.dimt{font:400 9px var(--mono);fill:var(--ink2)}
.axis circle{fill:var(--paper);stroke:var(--ink);stroke-width:1}.axis text{font:500 11px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.axis line{stroke:var(--ink2);stroke-width:.6;stroke-dasharray:14 4 2 4}
.furn{cursor:move}
.furn.plant rect.b{fill:color-mix(in srgb,#4f8a3c 22%,transparent);stroke:#4f8a3c;stroke-dasharray:none}
.furn.plant .d{stroke:#4f8a3c}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.pcards .card img.pic{height:110px;object-fit:cover}
.pcards .card .ph0{height:110px;display:grid;place-items:center;background:#eef3ea;color:#4f8a3c;font-size:34px;margin-bottom:6px}
.furn.fsel rect.b{stroke:var(--blau)!important;stroke-width:3!important;stroke-dasharray:none!important}
.furn.lift{opacity:.85}
.furn rect.b{stroke-width:1.6}
.furn.bestand rect.b{fill:color-mix(in srgb,var(--bestand) 14%,transparent);stroke:var(--bestand)}
.furn.neu rect.b{fill:color-mix(in srgb,var(--neu) 14%,transparent);stroke:var(--neu)}
.furn.abbruch rect.b{fill:color-mix(in srgb,var(--abbruch) 18%,transparent);stroke:var(--abbruch);stroke-dasharray:6 4}
.furn .d{fill:none;stroke-width:1;opacity:.8}
.furn.bestand .d{stroke:var(--bestand)}.furn.neu .d{stroke:var(--neu)}.furn.abbruch .d{stroke:var(--abbruch)}
.fl{font:500 8px var(--sans);fill:var(--ink);pointer-events:none}
.fl2{font:400 7px var(--mono);fill:var(--ink2);pointer-events:none}
.badge circle{fill:var(--neu)}.badge text{font:700 11px var(--sans);fill:#fff;text-anchor:middle;dominant-baseline:central}

/* Detailstufen */
.l0,.l2{display:none}
body.lod0 .l0{display:inline}body.lod0 .l1{display:none}
body.lod2 .l2{display:inline}
body.lod2 .l2b{display:block}
.l2b,.l0b{display:none}
body.lod0 .l0b{display:flex}
.fsum{position:absolute;inset:0;flex-direction:column;justify-content:center;align-items:center;gap:8px;background:color-mix(in srgb,var(--paper) 88%,transparent);cursor:move;text-align:center}
.fsum span{font:700 80px var(--sans);letter-spacing:-.03em;text-transform:lowercase;color:var(--ink)}
.fsum b{font:700 140px/1 var(--sans);letter-spacing:-.04em;color:var(--blau)}
.rinfo{position:absolute;font:9px/1.3 var(--sans);color:var(--ink);pointer-events:auto;overflow:hidden;background:color-mix(in srgb,var(--paper) 90%,transparent);border:.6px solid var(--line);padding:5px 6px}
.rinfo .ph{display:flex;gap:4px;margin:3px 0 4px}
.rinfo .ph img{width:44px;height:58px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in}
.rinfo b{font-weight:600}
.rinfo ul{margin:2px 0 0;padding-left:10px}
.rinfo button{font:500 8px var(--sans);border:1px solid var(--ink);background:var(--paper);padding:2px 5px;margin-top:4px}

/* Schriftfeld */
.tblock{position:absolute;display:grid;grid-template-columns:1.4fr 1fr 1fr .9fr;border:1.5px solid var(--ink);background:var(--paper);font-family:var(--sans)}
.tblock>div{border-left:1px solid var(--ink);padding:8px 10px;min-height:76px}
.tblock>div:first-child{border-left:0}
.tblock small{display:block;font:500 9px var(--mono);letter-spacing:.08em;text-transform:lowercase;color:var(--ink2)}
.tblock .big{font:700 44px/1 var(--sans);letter-spacing:-.04em;color:var(--blau)}
.tblock .mid{font:600 17px/1.2 var(--sans)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font:10px var(--sans)}
.legend i{display:inline-block;width:14px;height:8px;margin-right:4px;vertical-align:middle;border:1.5px solid}

/* Karten in Zonen */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);padding:10px;font-size:12px;cursor:grab;user-select:none;position:relative}
.card:hover{border-color:var(--eiche)}
.card svg{display:block;width:100%;height:70px;margin-bottom:6px}
.card b{display:block;font-weight:600;line-height:1.2}
.card .m{font:10px var(--mono);color:var(--ink2);margin-top:2px}
.chip{display:inline-block;font:600 9px var(--sans);letter-spacing:.01em;padding:2px 5px;margin-top:6px;border:1.5px solid}
.chip.bestand{border-color:var(--bestand)}.chip.neu{border-color:var(--neu);color:var(--neu)}.chip.abbruch{border-color:var(--abbruch);border-style:dashed}
.mbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-4px 0 10px}
.mbar .sum{font:500 11px var(--mono);color:var(--ink2);margin-left:auto}
.plus{width:36px;height:36px;border-radius:50%;border:0;background:var(--blau);color:#fff;font:500 24px/1 var(--sans);cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.plus:hover{filter:brightness(1.1)}
.rgrps{columns:3 240px;column-gap:20px}
.rgrp{border-top:1px dashed var(--line);padding:8px 0 10px;break-inside:avoid}
.rgrp h5{display:flex;justify-content:space-between;gap:8px;margin:0 0 8px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.rgrp .cards{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.rgrp .card svg,.rgrp .card img.pic{height:52px}
.pb{display:inline-block;font:600 9px var(--sans);padding:2px 6px;border-radius:8px;text-transform:uppercase;letter-spacing:.04em;margin:6px 4px 0 0;cursor:pointer;white-space:nowrap}
.pb.p1{background:#e2412b;color:#fff}.pb.p2{background:#f2c230;color:var(--ink)}.pb.p3{background:#e6defa;color:#5a4a8a}
.mbar .pb{margin:0;cursor:default}
.mleer{font:400 11px var(--mono);color:var(--ink2);margin:8px 0 0}
.card.placed::after{content:"im Plan";position:absolute;right:8px;top:8px;font:500 9px var(--mono);color:var(--blau)}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;height:100%}
.col{border-top:3px solid var(--neu);padding-top:8px;min-width:0}
.col h4{margin:0 0 8px;font:600 12px var(--sans);text-transform:lowercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.col .card{padding:7px 8px;margin-bottom:8px;cursor:default}
.vt{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,280px);gap:14px;height:100%;overflow-x:auto;align-items:start}
.vt .col{border-top-color:var(--blau);height:100%;overflow-y:auto}
.vt .col.ok{border-top-color:#2e8b57}
.vt .col h4 small{font:500 10px var(--mono);letter-spacing:0;color:var(--ink2)}
.vc{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--line);padding:8px 9px;margin-bottom:8px;font-size:12px;cursor:pointer;position:relative}
.vc:hover{border-color:var(--blau)}
.vc b{display:block;font-weight:600;line-height:1.2;padding-right:56px}
.vc .pr{font:600 15px var(--sans);margin-top:4px}.vc .pr small{font:500 10px var(--mono);color:var(--ink2)}
.vc .m{font:10px var(--mono);color:var(--ink2);margin-top:2px}
.vc .st{position:absolute;right:7px;top:7px;font:600 9px var(--sans);padding:2px 5px;border:1.5px solid var(--line)}
.vc.ok{border-left-color:#2e8b57}.vc.ok .st{border-color:#2e8b57;color:#2e8b57}
.vc.best:not(.ok) .st{border-color:var(--blau);color:var(--blau)}
.vc.weg{opacity:.5}
.vc.kd{border-left-color:var(--neu)}.vc.kd .st{border-color:var(--neu);color:var(--neu)}
.vadd{display:block;width:100%;padding:7px;border:1px dashed var(--line);background:none;font:500 12px var(--sans);color:var(--ink2);cursor:pointer;text-transform:lowercase}
.vadd:hover{border-color:var(--blau);color:var(--blau)}
.vt .newcol{border-top:3px dashed var(--line);padding-top:8px}
/* Utensilien: Checkliste nach Kategorie */
.ucats{columns:3 260px;column-gap:18px}
.ucat{break-inside:avoid;background:var(--paper);border:1px solid var(--line);padding:10px 12px 8px;margin-bottom:14px}
.ucat h5{display:flex;justify-content:space-between;gap:8px;margin:0 0 4px;font:600 15px var(--sans);text-transform:lowercase;letter-spacing:-.01em}
.ucat h5 span{font:400 11px var(--mono);color:var(--ink2)}
.urow{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.ubox{width:18px;height:18px;border:1.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;font:700 12px/1 var(--sans);padding:0;color:var(--paper)}
.ubox.bestellt{background:#f6e3a6}.ubox.haben{background:var(--ink)}
.uname{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.uname:hover{color:var(--blau)}
.urow.haben .uname{text-decoration:line-through;color:var(--ink2)}
.urow .q{font:400 11px var(--mono);color:var(--ink2);white-space:nowrap}
.ucat .vadd{margin-top:6px;padding:4px}
.uleg{display:inline-flex;align-items:center;gap:5px;font:500 11px var(--mono);color:var(--ink2);margin-right:8px}
.uleg .ubox{width:12px;height:12px;font-size:9px;cursor:default}
.tl .tag.vtr{border-left-color:#2e8b57;cursor:pointer}.tl .tag.vtr.kd{border-left-color:var(--neu)}
.tl{position:absolute;inset:18px}
.tl .ax{position:absolute;right:0;top:34px;border-top:1.5px solid var(--ink)}
.tl .nd{position:absolute;left:0;top:0;bottom:0;width:220px;border-right:1px dashed var(--line);padding-right:12px;overflow:auto}
.tl .nd h5{margin:0 0 10px;font:700 18px var(--sans);letter-spacing:-.02em}
.tl .nd .tag{position:static;display:block;margin-bottom:6px;max-width:none}
.tl .tag{cursor:grab}
.tl .tag.nt{border-left-width:6px;border-left-color:rgba(28,42,75,.25);font-family:var(--hand)}
.tl .tick.wk{height:6px;top:31px;opacity:.5}
.tlh{font:12px var(--sans);color:var(--ink2);margin:8px 0 0}
.tlh2{position:absolute;right:0;bottom:0;margin:0}
.note .due{position:absolute;right:8px;bottom:6px;font:700 11px var(--sans);background:var(--ink);color:#fff;padding:2px 6px;border-radius:9px;cursor:pointer}
.tl .mo{position:absolute;top:8px;font:600 12px var(--mono);text-transform:lowercase}
.tl .tick{position:absolute;top:28px;height:12px;border-left:1px solid var(--ink)}
.tl .tag{position:absolute;max-width:170px;padding:5px 7px;font:12px/1.2 var(--sans);background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--eiche);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .tag.ev{background:var(--blau);color:#fff;border:0;border-left:3px solid #1a2f9c;font-weight:600}
.tl .tag.ev small{font:400 10px var(--mono);opacity:.85;margin-left:5px}
.tl .tag.ev.past{opacity:.5}
.tl .evband{position:absolute;right:0;height:0;border-top:1px dashed var(--line)}
.tl .evlab{position:absolute;font:600 10px var(--mono);color:var(--blau);text-transform:uppercase;letter-spacing:.08em}
.tl .nd .nbtn{display:inline-block;margin:0 6px 10px 0;padding:5px 9px;border:1px solid var(--line);background:var(--paper);font:600 12px var(--sans);color:var(--ink);cursor:pointer}
.pin{position:absolute;inset:0;display:grid;gap:0}
.pin .pc{border-left:1px dashed var(--line);position:relative;min-width:0}
.pin .pc:first-child{border-left:0}
.pin .ph{display:flex;align-items:center;gap:8px;padding:10px 14px 6px;font:700 15px var(--sans);text-transform:lowercase;letter-spacing:-.01em;cursor:text}
.pin .ph button{margin-left:auto;border:1px solid var(--line);background:var(--paper);font:600 11px var(--sans);padding:3px 7px;cursor:pointer;color:var(--ink)}
.tl .tag.done{opacity:.45;text-decoration:line-through}
.tl .tag.late{border-left-color:var(--neu)}
.tl .mv{position:absolute;top:0;bottom:0;border-left:3px solid var(--neu)}
.tl .mv span,.tl .td span{position:absolute;top:-24px;left:6px;font:700 12px var(--sans);color:var(--neu);white-space:nowrap}
.tl .td{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--blau)}
.tl .td span{color:var(--blau)}
.now li{margin:0 0 8px;font-size:15px}
.now li span{font:500 11px var(--mono);color:var(--ink2);margin-right:6px}
.geld{display:grid;grid-template-columns:1.15fr 1fr;gap:30px;height:100%}
.gt{width:100%;border-collapse:collapse}
.gt th,.gt td{padding:7px 4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.gt th:first-child{text-align:left;font:500 13px var(--sans);color:var(--ink2)}
.gt tr:first-child th{border-top:0;font:500 11px var(--mono);color:var(--ink2);text-transform:lowercase}
.gt td{font:500 13px var(--mono)}
.gt tr.s th,.gt tr.s td{border-top:2px solid var(--ink);font-weight:700;color:var(--ink)}
.gnote{font:400 11px var(--mono);color:var(--ink2);margin:8px 0 0}
.gaus{margin-top:22px;border-top:3px solid var(--blau);padding-top:8px;display:grid;gap:8px;justify-items:start}
.gaus small{font:500 11px var(--mono);color:var(--ink2)}
.gaus b{font:800 28px/1.1 var(--sans);letter-spacing:-.02em}
.gbtn{border:1px solid var(--blau);color:var(--blau);background:#fff;border-radius:8px;padding:6px 12px;font:600 12px var(--sans);cursor:pointer}
.gbtn:hover{background:var(--blau);color:#fff}
.glink{display:block;border:0;background:none;padding:0;margin-top:16px;font:500 11px var(--mono);color:var(--ink2);cursor:pointer;text-decoration:underline}
.gh{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.grow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.grow .q{font:500 12px var(--mono);white-space:nowrap}.grow .q.ein{color:#2e8b57}
.grow small{font:400 10px var(--mono);color:var(--neu);margin-left:6px}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.money div{border-top:3px solid var(--eiche);padding-top:6px}
.money b{display:block;font:800 34px var(--sans)}
.money small{font:11px var(--mono);color:var(--ink2)}

/* Bedienung */

  Object.keys(last.els).forEach(function(id){if(!now[id]){delete last.els[id];STORE.del("board",id)}});
  Object.keys(I).forEach(function(k){var j=JSON.stringify(I[k]);if(last.items[k]!==j){last.items[k]=j;var o=Object.assign({},I[k]);o.updated=new Date().toISOString();STORE.put("items",k,o)}});
  Object.keys(last.items).forEach(function(k){if(!I[k]){var o=JSON.parse(last.items[k]);delete last.items[k];o.deleted=new Date().toISOString();STORE.put("items",k,o)}});

  Object.keys(last.contracts).forEach(function(k){if(!C[k]){var o=JSON.parse(last.contracts[k]);delete last.contracts[k];o.deleted=new Date().toISOString();STORE.put("contracts",k,o)}});

var pending=false;
window.TAFEL_APPLY=function(c,id,data){var j=data?JSON.stringify(data):null;
  if(c==="board"&&data&&last.els[id]===j)return;
  if(c==="board"){if(!data){st.els=st.els.filter(function(e){return e.id!==id});delete last.els[id]}else{var ex=getEl(id);if(ex)Object.assign(ex,data);else st.els.push(data);last.els[id]=j}}
  else if(c==="items"){if(!data||data.deleted){delete I[id];delete last.items[id]}else{I[id]=data;last.items[id]=JSON.stringify(data)}}
  else if(c==="tasks"){if(!data||data.deleted){delete T[id];delete last.tasks[id]}else{if(last.tasks[id]===j)return;T[id]=data;last.tasks[id]=j}}
  else if(c==="events"){if(!data||data.deleted){delete E[id];delete last.events[id]}else{var je=JSON.stringify(data);if(last.events[id]===je)return;E[id]=data;last.events[id]=je}}
  else if(c==="contracts"){if(!data||data.deleted){delete C[id];delete last.contracts[id]}else{if(last.contracts[id]===j)return;C[id]=data;last.contracts[id]=j}}
  else if(c==="utensils"){if(!data||data.deleted){delete U[id];delete last.utensils[id]}else{if(last.utensils[id]===j)return;U[id]=data;last.utensils[id]=j}}
  else if(c==="costs"||c==="ausgleich"){var M=c==="costs"?K:A;if(!data||data.deleted){delete M[id];delete last[c][id]}else{if(last[c][id]===j)return;M[id]=data;last[c][id]=j}}
  else if(c==="meta"&&id==="settings"&&data)SETT=data;
  else if(c==="rooms"){if(!data||data.deleted){delete R[id];delete last.rooms[id]}else{if(last.rooms[id]===j)return;R[id]=data;last.rooms[id]=j}}
  else if(c==="meta"&&id==="plan"&&data)P=data;
  else if(c==="meta"&&id==="board"&&data){st.frames=Object.assign(defaults().frames,data);st.frames.user=st.frames.user||{};last.frames=JSON.stringify(st.frames)}
  else return;
  if(busy())pending=true;else render()};
setInterval(function(){if(pending&&!busy()){pending=false;render()}},700);

var TRASH={},TRC={rooms:"Raum",items:"Möbel",tasks:"Aufgabe",events:"Termin",contracts:"Vertrag",utensils:"Utensil",costs:"Kosten",ausgleich:"Ausgleich"};
Object.keys(TRC).forEach(function(c){var m=SEED[c]||{};Object.keys(m).forEach(function(id){if(m[id]&&m[id].deleted)TRASH[c+":"+id]={c:c,id:id,d:m[id]}})});
(function(){var ap=window.TAFEL_APPLY;window.TAFEL_APPLY=function(c,id,data){
  if(c==="meta"&&id==="plan"&&data)last.plan=JSON.stringify(data);
  if(c==="meta"&&id==="settings"&&data)last.settings=JSON.stringify(data);
  if(TRC[c]){if(data&&data.deleted)TRASH[c+":"+id]={c:c,id:id,d:data};else delete TRASH[c+":"+id]}
  return ap(c,id,data)}})();

/* ---------- Helfer ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pd(s){if(!s)return null;var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function days(s){return Math.round((pd(s)-today())/864e5)}
function toast(t){var e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},2400)}
function rooms(){return Object.keys(R).map(function(k){var r=Object.assign({},R[k]);r.id=k;return r}).sort(function(a,b){return a.order-b.order})}
function roomAt(x,y){return rooms().filter(function(r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h})[0]}
function cls(it){return DEC[it.dec]||"bestand"}
function dims(it){return it.rot===90?{w:+it.d,h:+it.w}:{w:+it.w,h:+it.d}}
function itemsIn(rid){return Object.keys(I).filter(function(k){var it=I[k];if(it.x==null)return false;var d=dims(it),r=roomAt(it.x+d.w/2,it.y+d.h/2);return r&&r.id===rid}).map(function(k){return Object.assign({id:k},I[k])})}
function bounds(){if(!Object.keys(R).length)return {x:0,y:0,w:800,h:800};var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;rooms().forEach(function(r){x0=Math.min(x0,r.x);y0=Math.min(y0,r.y);x1=Math.max(x1,r.x+r.w);y1=Math.max(y1,r.y+r.h)});return {x:x0,y:y0,w:x1-x0,h:y1-y0}}

  if(isPlant(it)){var cx=x+w/2,cy=y+h/2,r=w/2;for(var a=0;a<6;a++){var g=a*Math.PI/3+.3;s+='<path class="d" d="M'+cx+' '+cy+' Q'+(cx+Math.cos(g+.5)*r*.7)+' '+(cy+Math.sin(g+.5)*r*.7)+' '+(cx+Math.cos(g)*r*.85)+' '+(cy+Math.sin(g)*r*.85)+'"/>'}return s}

function migrateIdeas(){if(!STORE)return;var m=SEED.ideas||{},f=st.frames.mood,n=0,add=false,now=new Date().toISOString();
  Object.keys(m).forEach(function(id){var x=m[id];if(!x||x.deleted)return;var eid="idea-"+id;
    if(!getEl(eid)){var cx=f.x+30+(n%3)*280,cy=f.y+40+Math.floor(n/3)*340,rest=[x.notiz,x.link].filter(Boolean).join("\n");n++;
      if(x.img){st.els.push({id:eid,type:"img",x:cx,y:cy,w:250,h:290,src:x.img,text:x.title||""});if(rest)st.els.push({id:eid+"-n",type:"note",x:cx+30,y:cy+240,color:"weiss",text:rest})}
      else st.els.push({id:eid,type:"note",x:cx,y:cy,color:"weiss",text:[x.title,rest].filter(Boolean).join("\n")||"Idee"});add=true}
    STORE.put("ideas",id,Object.assign({},x,{deleted:now,moodboard:eid}))});
  if(add){save();render();toast("Ideen aus der Liste liegen jetzt im Moodboard")}}

/* ---------- Handy: Bereich als Vollbild ---------- */
var fullId=null;
function isMob(){return window.matchMedia&&matchMedia("(max-width:760px)").matches}
function ftitle(id){return FNAME[id]||(st.frames.user[id]&&st.frames.user[id].title)||"Bereich"}
function openFull(id){if(id==="plan"){closeFull();fit(planBox(),12);return}fullId=id;drawFull();$("#full").classList.add("open");$("#full-b").scrollTop=0}
function closeFull(){fullId=null;$("#full").classList.remove("open")}
function drawFull(){if(!fullId)return;var id=fullId,b=$("#full-b"),y=b.scrollTop,h;
  if(id==="now")h=nowHTML();else if(id==="moebel")h=moebelHTML();else if(id==="pflanzen")h=pflanzenHTML();else if(id==="verkauf")h=verkaufHTML();else if(id==="zeit")h=zeitListHTML();
  else if(id==="geld")h=typeof geldHTML==="function"?geldHTML():"";else if(id==="vertraege")h=vertraegeHTML();else if(id==="utensilien")h=utensilienHTML();else h=frameElsHTML(id);
  $("#full-h").textContent=ftitle(id);b.innerHTML=h;b.scrollTop=y}
function areasMenu(){var ids=["now","zeit","moebel","pflanzen","verkauf","utensilien","vertraege","geld","notizen","mood"].filter(function(k){return st.frames[k]&&!st.frames[k].hidden}).concat(Object.keys(st.frames.user||{}));
  $("#modal").innerHTML='<div class="bg"><form><h2>bereiche</h2><div class="foot" style="justify-content:flex-start"><button type="button" class="btn ghost" data-fullopen="plan">Grundriss</button>'+ids.map(function(k){return '<button type="button" class="btn ghost" data-fullopen="'+k+'">'+esc(ftitle(k))+'</button>'}).join("")+'</div><div class="foot"><button type="button" class="btn ghost" data-mx>Schließen</button></div></form></div>'}
function frameElsHTML(id){var f=st.frames[id]||st.frames.user[id];if(!f)return "";
  var L=st.els.filter(function(e){return e.x>f.x-30&&e.x<f.x+f.w&&e.y>f.y-30&&e.y<f.y+f.h}).sort(function(a,b){return (a.y-b.y)||(a.x-b.x)});
  return '<div class="zl"><div class="acts"><span data-fladd="'+esc(id)+'">+ Post-it</span></div></div><div class="fl-list">'+L.map(function(e){
    if(e.type==="img")return '<div class="img"><img src="'+e.src+'" alt=""><div class="cap">'+esc(e.text||"")+'</div></div>';
    if(e.type==="note")return '<div class="note n-'+(e.color||"gelb")+'" data-flel="'+e.id+'">'+esc(e.text||"")+'</div>';
    return '<div class="txt" style="font-size:24px">'+esc(e.text||"")+'</div>'}).join("")+'</div>'+(L.length?'':'<p class="mleer">Noch leer.</p>')}
function noteEdit(id){var e=getEl(id);if(!e)return;
  $("#modal").innerHTML='<div class="bg"><form id="nef"><h2>post-it</h2><label>Text<textarea id="ne-t" style="min-height:140px;font:15px/1.4 var(--hand);padding:10px;border:1px solid #d9d2c3;border-radius:9px">'+esc(e.text||"")+'</textarea></label><div class="foot"><button type="button" class="btn del" id="ne-del">Löschen</button><button type="button" class="btn ghost" data-mx>Abbrechen</button><button class="btn">Speichern</button></div></form></div>';
  $("#ne-del").onclick=function(){dropNote(id);save();$("#modal").innerHTML="";render()};
  $("#nef").addEventListener("submit",function(ev){ev.preventDefault();var v=$("#ne-t").value.trim();if(v)e.text=v;else dropNote(id);save();$("#modal").innerHTML="";render()});
  setTimeout(function(){$("#ne-t").focus()},30)}
function zeitListHTML(){var t0=today(),rows=[],nd=[];
  tasksAll().forEach(function(t){if(t.done)return;if(!t.due)nd.push(t);else rows.push({d:t.due,k:"t",o:t})});
  evAll().forEach(function(e){if(e.date&&days(e.date)>=0)rows.push({d:e.date+(e.time||""),k:"e",o:e})});
  vtrAll().forEach(function(v){if(v.ab&&v.status&&v.status!=="vergleich"&&days(v.ab)>=0)rows.push({d:v.ab,k:"v",o:v})});
  rows.sort(function(a,b){return a.d<b.d?-1:1});
  var tr=function(t){return '<div class="zr"><button class="tbox" data-tdone="'+t.id+'" aria-label="'+esc(t.title)+' erledigt"></button><b data-task="'+t.id+'">'+esc(t.title||"Ohne Titel")+(t.wer?' <small style="color:var(--ink2)">· '+esc(t.wer)+'</small>':'')+'</b><span>'+(t.due?fmtD(t.due):'')+'</span></div>'};
  var late=rows.filter(function(r){return r.k==="t"&&pd(r.d)<t0}),fut=rows.filter(function(r){return !(r.k==="t"&&pd(r.d)<t0)}),mon="",s='<div class="zl"><div class="acts"><span data-newev>+ Termin</span><span data-newtask>+ Aufgabe</span><span data-ics>Kalenderdatei</span></div>';
  if(late.length)s+='<h4 class="late">überfällig · '+late.length+'</h4>'+late.map(function(r){return tr(r.o)}).join("");
  fut.forEach(function(r){var d=pd(r.d.slice(0,10)),m=MON[d.getMonth()].toLowerCase()+' '+d.getFullYear();if(m!==mon){mon=m;s+='<h4>'+m+'</h4>'}
    if(r.k==="t")s+=tr(r.o);else if(r.k==="e")s+='<div class="zr ev"><span>●</span><b data-ev="'+r.o.id+'">'+esc(r.o.title||"Termin")+(r.o.ort?' <small style="color:var(--ink2)">· '+esc(r.o.ort)+'</small>':'')+'</b><span>'+fmtD(r.o.date)+(r.o.time?' '+esc(r.o.time):'')+'</span></div>';
    else s+='<div class="zr"><span>§</span><b data-vtr="'+r.o.id+'">'+esc(vtrLab(r.o))+'</b><span>'+fmtD(r.o.ab)+'</span></div>'});
  s+='<h4>ohne datum · '+nd.length+'</h4>'+(nd.length?nd.map(tr).join(""):'<p class="mleer">Alles hat ein Datum.</p>');
  return s+'</div>'}
$("#full").addEventListener("click",function(e){var t=e.target,b;
  if(t.closest("[data-fullx]")){closeFull();return}
  if((b=t.closest("[data-prio]"))){var ip=I[b.dataset.prio];if(ip){ip.prio=prioOf(ip)%3+1;save();render();toast(shortName(ip)+": "+PRIO[ip.prio])}return}

document.addEventListener("click",function(e){var t=e.target,b;if(!t.closest)return;
  if((b=t.closest("[data-tdone]"))){var tk=T[b.dataset.tdone];if(tk){tk.done=true;save();render();toast("Erledigt: "+tk.title)}return}

  if(!t.closest("#rb"))return;var r=R[sheetId];if(!r)return;

  if(t.closest("[data-rblock]")){sheetEdit=false;drawSheet();return}
  if((b=t.closest("[data-opadd]"))){var kd=b.dataset.opadd;P[kd]=P[kd]||[];P[kd].push({room:sheetId,wall:"s",off:20,w:kd==="doors"?80:100});save();render();drawSheet();return}
  if((b=t.closest("[data-ophinge]"))){var dr=P.doors[+b.dataset.ophinge];if(dr){if(dr.hinge==="end")delete dr.hinge;else dr.hinge="end";save();render();drawSheet()}return}
  if((b=t.closest("[data-opdel]"))){var q=b.dataset.opdel.split(":");if(P[q[0]]&&confirm(q[0]==="doors"?"Diese Tür entfernen?":"Dieses Fenster entfernen?")){P[q[0]].splice(+q[1],1);save();render();drawSheet()}return}
  if(t.closest("[data-roomadd]")){var nid="r"+Date.now().toString(36),mo=rooms().reduce(function(a,x){return Math.max(a,+x.order||0)},0);R[nid]={name:"Neuer Raum",x:PB.x+PB.w+40,y:PB.y,w:300,h:300,order:mo+1,photos:[]};save();render();openSheet(nid);sheetEdit=true;drawSheet();toast("Neuer Raum rechts neben dem Grundriss");return}
  if(t.closest("[data-roomdel]")){if(!confirm("Raum „"+r.name+"“ löschen? Er landet im Papierkorb unter „daten“."))return;var od=Object.assign({},r,{deleted:new Date().toISOString()}),rid=sheetId;TRASH["rooms:"+rid]={c:"rooms",id:rid,d:od};if(STORE)STORE.put("rooms",rid,od);delete R[rid];delete last.rooms[rid];sheetEdit=false;$("#rb").classList.remove("open");sheetId=null;render();toast("Raum im Papierkorb");return}});
