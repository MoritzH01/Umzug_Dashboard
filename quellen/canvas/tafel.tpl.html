<title>Umzug Canvas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Zwei Oberflächen für denselben Plan: Zeichentisch (Transparentpapier, Tusche) und Tafel (Schiefer, Kreide).
   Farben im Plan nach Bauantrag-Konvention: Bestand grau, Neu rot, Abbruch/geht weg gelb gestrichelt. */
:root{
  --bg:#f5f2ec;--grid1:rgba(35,64,200,.05);--grid2:rgba(35,64,200,.10);
  --ink:#1c2a4b;--ink2:#5b6580;--paper:#ffffff;--line:#dedbd2;
  --wall:#1c2a4b;--floor:#ffffff;--floor2:#f7f1e6;--hatch:#9a958a;
  --neu:#e34a2f;--abbruch:#e2b33a;--bestand:#6b7387;--blau:#2f4ee0;--orange:#f28c28;--eiche:#c8995f;
  --steel:linear-gradient(180deg,#f4f5f5,#dfe2e2 55%,#cfd3d3);
  --ui:#f1f2f2;--uiline:#b9bebe;--shadow:0 1px 0 rgba(0,0,0,.05),0 6px 18px rgba(40,35,20,.10);
  --hand:"Courier Prime","Courier New",monospace;--sans:"Inter Tight",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#board{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid1) 1px,transparent 1px),linear-gradient(90deg,var(--grid1) 1px,transparent 1px)}
#board.panning{cursor:grabbing}
#board,#board *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#board [contenteditable="true"],#board [contenteditable="true"] *{-webkit-user-select:text;user-select:text}
#board img{-webkit-user-drag:none}
.ui,#hint,#mini,#ftool{-webkit-user-select:none;user-select:none}
#hint{pointer-events:none}
#ftool{position:fixed;z-index:25;display:none;gap:2px;background:var(--ink);padding:4px;border-radius:10px;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);transform:translate(-50%,calc(-100% - 10px))}
#ftool.on{display:flex}
#ftool button{border:0;background:transparent;color:#fff;font:500 13px var(--sans);padding:6px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
#ftool button:hover{background:rgba(255,255,255,.14)}
#ftool b{color:#fff;font:600 12px var(--sans);padding:6px 8px 6px 6px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
body.moving #world{will-change:transform}
.el{position:absolute}
.sel{outline:2px solid var(--blau);outline-offset:3px}

/* Rahmen / Zonen */
.frame{border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 70%,transparent);border-radius:2px}
.fhead{position:absolute;left:-1px;top:-46px;height:42px;display:flex;align-items:baseline;gap:12px;padding:0 2px;background:none;color:var(--ink);font:700 30px var(--sans);letter-spacing:-.025em;text-transform:lowercase;cursor:move;white-space:nowrap;user-select:none}
.fhead small{font:400 13px var(--sans);color:var(--ink2);letter-spacing:0}
.fbody{position:absolute;inset:0;padding:18px;overflow:hidden}

/* Post-its */
.note{width:190px;height:170px;box-sizing:border-box;padding:18px 14px 14px;font:16px/1.3 var(--hand);color:#1c2a4b;letter-spacing:.01em;box-shadow:0 1px 1px rgba(0,0,0,.08),0 10px 18px -8px rgba(0,0,0,.35);cursor:move;user-select:none}
.note .nt{height:100%;overflow:hidden;overflow-wrap:anywhere;white-space:pre-wrap;outline:0}
.note.edit{outline:2px solid var(--blau)}.note .nt[contenteditable="true"]{cursor:text;user-select:text;overflow:visible}
.note::before{content:"";position:absolute;left:50%;top:-9px;width:68px;height:20px;transform:translateX(-50%) rotate(-2deg);background:rgba(240,235,215,.75);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.note[contenteditable="true"]{cursor:text;user-select:text;outline:2px solid var(--blau)}
.n-gelb{background:#ffe066}.n-rosa{background:#ffadc7}.n-blau{background:#a8d4ff}.n-gruen{background:#bfe8a8}.n-orange{background:#ffb86b}.n-weiss{background:#fbfaf6}
.txt{font:700 36px/1.05 var(--sans);letter-spacing:-.03em;text-transform:lowercase;color:var(--ink);cursor:move;white-space:pre-wrap;min-width:60px;user-select:none}
.txt[contenteditable="true"]{cursor:text;user-select:text;outline:1px dashed var(--blau)}
.img{background:#fff;padding:10px 10px 34px;box-shadow:var(--shadow);cursor:move}
.img img{display:block;width:100%;height:calc(100% );object-fit:cover;pointer-events:none}
.img .cap{position:absolute;left:10px;right:10px;bottom:8px;font:13px var(--hand);color:#1c2a4b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;background:var(--blau);border:2px solid #fff;cursor:nwse-resize;display:none}
.sel .rs,.frame:hover>.rs{display:block}
.x{position:absolute;right:-12px;top:-12px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font:600 13px var(--sans);display:none;line-height:24px;padding:0}
.sel .x,.frame:hover>.x{display:block}

/* Planblatt */
.sheet{background:var(--paper);box-shadow:var(--shadow);border:1px solid var(--line)}
.sheet svg{position:absolute;overflow:visible}
.sheet .sheethead{position:absolute;left:0;right:0;top:-34px;height:34px;cursor:move}
.room-floor{fill:var(--floor);cursor:pointer;transition:fill .15s}
.room-floor:hover{fill:var(--floor2)}
.room-floor.out{fill:url(#out)}
.wall{fill:none;stroke:var(--wall);stroke-width:10;stroke-linejoin:miter}
.gap{stroke:var(--floor-solid,#fffdf8);stroke-width:14}
.swing{fill:none;stroke:var(--ink2);stroke-width:1;stroke-dasharray:4 3}
.leaf{stroke:var(--ink);stroke-width:2}
.win{stroke:var(--ink);stroke-width:1.2}
.fixed rect{fill:url(#hatch);stroke:var(--ink2);stroke-width:1}
.rlabel{font:700 16px var(--sans);letter-spacing:-.02em;fill:var(--ink);pointer-events:none}
.rsub{font:400 9px var(--mono);fill:var(--ink2);pointer-events:none}
.rbig{font:700 54px var(--sans);fill:var(--ink);pointer-events:none;letter-spacing:-.035em}
.rbig2{font:500 26px var(--mono);fill:var(--ink2);pointer-events:none}
.dim{stroke:var(--ink2);stroke-width:.8}.dimt{font:400 9px var(--mono);fill:var(--ink2)}
.axis circle{fill:var(--paper);stroke:var(--ink);stroke-width:1}.axis text{font:500 11px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.axis line{stroke:var(--ink2);stroke-width:.6;stroke-dasharray:14 4 2 4}
.furn{cursor:move}
.furn.plant rect.b{fill:color-mix(in srgb,#4f8a3c 22%,transparent);stroke:#4f8a3c;stroke-dasharray:none}
.furn.plant .d{stroke:#4f8a3c}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.pcards .card img.pic{height:110px;object-fit:cover}
.pcards .card .ph0{height:110px;display:grid;place-items:center;background:#eef3ea;color:#4f8a3c;font-size:34px;margin-bottom:6px}
.furn.fsel rect.b{stroke:var(--blau)!important;stroke-width:3!important;stroke-dasharray:none!important}
.furn.lift{opacity:.85}
.furn rect.b{stroke-width:1.6}
.furn.bestand rect.b{fill:color-mix(in srgb,var(--bestand) 14%,transparent);stroke:var(--bestand)}
.furn.neu rect.b{fill:color-mix(in srgb,var(--neu) 14%,transparent);stroke:var(--neu)}
.furn.abbruch rect.b{fill:color-mix(in srgb,var(--abbruch) 18%,transparent);stroke:var(--abbruch);stroke-dasharray:6 4}
.furn .d{fill:none;stroke-width:1;opacity:.8}
.furn.bestand .d{stroke:var(--bestand)}.furn.neu .d{stroke:var(--neu)}.furn.abbruch .d{stroke:var(--abbruch)}
.fl{font:500 8px var(--sans);fill:var(--ink);pointer-events:none}
.fl2{font:400 7px var(--mono);fill:var(--ink2);pointer-events:none}
.badge circle{fill:var(--neu)}.badge text{font:700 11px var(--sans);fill:#fff;text-anchor:middle;dominant-baseline:central}

/* Detailstufen */
.l0,.l2{display:none}
body.lod0 .l0{display:inline}body.lod0 .l1{display:none}
body.lod2 .l2{display:inline}
body.lod2 .l2b{display:block}
.l2b,.l0b{display:none}
body.lod0 .l0b{display:flex}
.fsum{position:absolute;inset:0;flex-direction:column;justify-content:center;align-items:center;gap:8px;background:color-mix(in srgb,var(--paper) 88%,transparent);cursor:move;text-align:center}
.fsum span{font:700 80px var(--sans);letter-spacing:-.03em;text-transform:lowercase;color:var(--ink)}
.fsum b{font:700 140px/1 var(--sans);letter-spacing:-.04em;color:var(--blau)}
.rinfo{position:absolute;font:9px/1.3 var(--sans);color:var(--ink);pointer-events:auto;overflow:hidden;background:color-mix(in srgb,var(--paper) 90%,transparent);border:.6px solid var(--line);padding:5px 6px}
.rinfo .ph{display:flex;gap:4px;margin:3px 0 4px}
.rinfo .ph img{width:44px;height:58px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in}
.rinfo b{font-weight:600}
.rinfo ul{margin:2px 0 0;padding-left:10px}
.rinfo button{font:500 8px var(--sans);border:1px solid var(--ink);background:var(--paper);padding:2px 5px;margin-top:4px}

/* Schriftfeld */
.tblock{position:absolute;display:grid;grid-template-columns:1.4fr 1fr 1fr .9fr;border:1.5px solid var(--ink);background:var(--paper);font-family:var(--sans)}
.tblock>div{border-left:1px solid var(--ink);padding:8px 10px;min-height:76px}
.tblock>div:first-child{border-left:0}
.tblock small{display:block;font:500 9px var(--mono);letter-spacing:.08em;text-transform:lowercase;color:var(--ink2)}
.tblock .big{font:700 44px/1 var(--sans);letter-spacing:-.04em;color:var(--blau)}
.tblock .mid{font:600 17px/1.2 var(--sans)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font:10px var(--sans)}
.legend i{display:inline-block;width:14px;height:8px;margin-right:4px;vertical-align:middle;border:1.5px solid}

/* Karten in Zonen */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);padding:10px;font-size:12px;cursor:grab;user-select:none;position:relative}
.card:hover{border-color:var(--eiche)}
.card svg{display:block;width:100%;height:70px;margin-bottom:6px}
.card b{display:block;font-weight:600;line-height:1.2}
.card .m{font:10px var(--mono);color:var(--ink2);margin-top:2px}
.chip{display:inline-block;font:600 9px var(--sans);letter-spacing:.01em;padding:2px 5px;margin-top:6px;border:1.5px solid}
.chip.bestand{border-color:var(--bestand)}.chip.neu{border-color:var(--neu);color:var(--neu)}.chip.abbruch{border-color:var(--abbruch);border-style:dashed}
.mbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-4px 0 10px}
.mbar .sum{font:500 11px var(--mono);color:var(--ink2);margin-left:auto}
.plus{width:36px;height:36px;border-radius:50%;border:0;background:var(--blau);color:#fff;font:500 24px/1 var(--sans);cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.plus:hover{filter:brightness(1.1)}
.rgrps{columns:3 240px;column-gap:20px}
.rgrp{border-top:1px dashed var(--line);padding:8px 0 10px;break-inside:avoid}
.rgrp h5{display:flex;justify-content:space-between;gap:8px;margin:0 0 8px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
/* Möbelkacheln: Foto oben (4:3), Farbe nur für die Entscheidung, Wichtigkeit als Zwischenüberschrift */
.rgrp .cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.rgrp .psub{display:flex;gap:6px;margin:10px 0 6px;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.rgrp .psub:first-of-type{margin-top:2px}.rgrp .psub span{opacity:.6}
.rgrp .card{padding:0;display:flex;flex-direction:column}
.rgrp .card>svg,.rgrp .card>img.pic{width:100%;height:auto;aspect-ratio:4/3;margin:0;border-bottom:1px solid var(--line);background:#fff;object-fit:contain}
.rgrp .card>svg{background:#f6f4ef}
.rgrp .card .cb{padding:8px 9px 9px;display:flex;flex-direction:column;gap:2px;flex:1}
.rgrp .card b{font-size:13px;line-height:1.25}
.rgrp .card .m span{white-space:nowrap}
.rgrp .card .auch{font:500 10px var(--sans);color:var(--ink2)}
.rgrp .card .cf{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;padding-top:6px}
.rgrp .card.placed::after{content:"im plan";display:flex;align-items:center;gap:4px;top:7px;right:7px;background:var(--paper);border:1px solid var(--line);padding:1px 6px}
.dec{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--sans);white-space:nowrap}
.dec i{width:9px;height:9px;border:1.5px solid;flex:none}
.dec.bestand{color:var(--ink2)}.dec.bestand i{border-color:var(--bestand);background:color-mix(in srgb,var(--bestand) 18%,#fff)}
.dec.neu{color:var(--neu)}.dec.neu i{border-color:var(--neu);background:color-mix(in srgb,var(--neu) 18%,#fff)}
.dec.abbruch{color:#9a7414}.dec.abbruch i{border-color:var(--abbruch);border-style:dashed}
.mleer{font:400 11px var(--mono);color:var(--ink2);margin:8px 0 0}
.card.placed::after{content:"im Plan";position:absolute;right:8px;top:8px;font:500 9px var(--mono);color:var(--blau)}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;height:100%}
.vk{display:flex;flex-direction:column;height:100%}.vk .pipe{flex:1;min-height:0;height:auto}
.vk .nbtn{padding:4px 8px;border:1px solid var(--line);background:var(--paper);font:600 11px var(--sans);color:var(--ink);cursor:pointer}.vk .nbtn:hover{border-color:var(--blau);color:var(--blau)}
.col.nm{border-top-color:var(--blau)}
.chip.auch{opacity:.75;font-weight:500}
a.ext{color:var(--blau);text-decoration:none;font:600 10px var(--sans);white-space:nowrap}a.ext:hover{text-decoration:underline}
.card .lk{margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.col{border-top:3px solid var(--neu);padding-top:8px;min-width:0}
.col h4{margin:0 0 8px;font:600 12px var(--sans);text-transform:lowercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.col .card{padding:7px 8px;margin-bottom:8px;cursor:default}
.vt{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-items:start}
.vt .col{border-top-color:var(--blau)}
.vt .col.ok{border-top-color:#2e8b57}
.vt .col h4 small{font:500 10px var(--mono);letter-spacing:0;color:var(--ink2)}
.vc{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--line);padding:8px 9px;margin-bottom:8px;font-size:12px;cursor:pointer;position:relative}
.vc:hover{border-color:var(--blau)}
.vc b{display:block;font-weight:600;line-height:1.2;padding-right:56px}
.vc .pr{font:600 15px var(--sans);margin-top:4px}.vc .pr small{font:500 10px var(--mono);color:var(--ink2)}
.vc .m{font:10px var(--mono);color:var(--ink2);margin-top:2px}
.vc .st{position:absolute;right:7px;top:7px;font:600 9px var(--sans);padding:2px 5px;border:1.5px solid var(--line)}
.vc.ok{border-left-color:#2e8b57}.vc.ok .st{border-color:#2e8b57;color:#2e8b57}
.vc.best:not(.ok) .st{border-color:var(--blau);color:var(--blau)}
.vc.weg{opacity:.5}
.vc.kd{border-left-color:var(--neu)}.vc.kd .st{border-color:var(--neu);color:var(--neu)}
.vadd{display:block;width:100%;padding:7px;border:1px dashed var(--line);background:none;font:500 12px var(--sans);color:var(--ink2);cursor:pointer;text-transform:lowercase}
.vadd:hover{border-color:var(--blau);color:var(--blau)}
.vt .col.strom{grid-column:span 3}
.verb{display:block;margin:-2px 0 8px;padding:0;border:0;background:none;font:500 10px var(--mono);color:var(--ink2);cursor:pointer;text-align:left}.verb:hover{color:var(--blau)}
.vc .m.k{color:var(--ink)}
.vc .st2{display:inline-block;font:600 9px var(--sans);padding:1px 5px;border:1.5px dashed var(--blau);color:var(--blau);margin-top:4px}
table.vst{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);margin-bottom:8px}
table.vst th{font:500 9px var(--mono);color:var(--ink2);text-align:right;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.vst td{padding:6px;border-bottom:1px solid var(--line);text-align:right;font:11px var(--mono);white-space:nowrap;vertical-align:top}
table.vst th:first-child,table.vst td:first-child{text-align:left}
table.vst td:first-child{font:600 12px var(--sans);white-space:normal}
table.vst tr{cursor:pointer}table.vst tr:hover td{background:#f7f8ff}
table.vst td.j2{font:600 13px var(--sans)}table.vst td.j2 small{display:block;font:500 9px var(--mono);color:var(--ink2)}
table.vst tr.best td.j2,table.vst tr.b1 td.j1{color:var(--blau);font-weight:600}
table.vst tr.best td:first-child{box-shadow:inset 3px 0 var(--blau)}table.vst tr.ok td:first-child{box-shadow:inset 3px 0 #2e8b57}table.vst tr.kd td:first-child{box-shadow:inset 3px 0 var(--neu)}
table.vst tr.weg td,table.vst tr.kd td{opacity:.6}
table.vst .tag{display:inline-block;font:600 8px var(--sans);padding:1px 4px;border:1.5px solid var(--blau);color:var(--blau);margin-left:5px;vertical-align:1px;white-space:nowrap}
table.vst .tag.b1{border-style:dashed}table.vst .tag.kd{border-color:var(--neu);color:var(--neu)}table.vst .tag.ok{border-color:#2e8b57;color:#2e8b57}
table.vst a.ext{margin-left:5px;font-weight:500}
.vleg{font:10px var(--mono);color:var(--ink2);margin:0 0 8px}
#v-strom{display:grid;gap:14px}
#v-holp{display:grid;gap:10px}#v-holp .btn{margin-right:4px}
#v-txt{min-height:90px;font:13px/1.4 var(--sans);padding:9px 11px;border:1px solid #d9d2c3;border-radius:9px;resize:vertical}
#v-wahl{display:grid;gap:6px}#v-wahl:empty{display:none}
.vw{display:grid;gap:2px;text-align:left;padding:8px 10px;border:1px solid #d9d2c3;border-radius:9px;background:#fff;font:600 13px var(--sans);color:var(--ink);cursor:pointer}
.vw span{font:400 11px var(--mono);color:var(--ink2)}.vw.on{border-color:var(--blau);box-shadow:inset 3px 0 var(--blau)}
.vt .newcol{border-top:3px dashed var(--line);padding-top:8px}
/* Utensilien: Checkliste nach Kategorie */
.ucats{columns:3 260px;column-gap:18px}
.ucat{break-inside:avoid;background:var(--paper);border:1px solid var(--line);padding:10px 12px 8px;margin-bottom:14px}
.ucat h5{display:flex;justify-content:space-between;gap:8px;margin:0 0 4px;font:600 15px var(--sans);text-transform:lowercase;letter-spacing:-.01em}
.ucat h5 span{font:400 11px var(--mono);color:var(--ink2)}
.urow{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.ubox{width:18px;height:18px;border:1.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;font:700 12px/1 var(--sans);padding:0;color:var(--paper)}
.ubox.bestellt{background:#f6e3a6}.ubox.haben{background:var(--ink)}
.uname{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.uname:hover{color:var(--blau)}
.urow.haben .uname{text-decoration:line-through;color:var(--ink2)}
.urow .q{font:400 11px var(--mono);color:var(--ink2);white-space:nowrap}
.ucat .vadd{margin-top:6px;padding:4px}
/* Küchengeräte: Kandidaten je Gerät, Favorit oben */
.kgcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.kgcol h5{display:flex;justify-content:space-between;gap:8px;margin:0;font:600 17px var(--sans);text-transform:lowercase;letter-spacing:-.01em}
.kgcol h5 span{font:400 11px var(--mono);color:var(--ink2)}
.kgreq{margin:2px 0 10px;font:400 11px/1.4 var(--mono);color:var(--ink2)}

function migrateLabels(){var n=0,FST={Geplant:"Idee",Bestellt:"Bestellt",Geliefert:"Geliefert",Aufgebaut:"Geliefert"};
  Object.keys(I).forEach(function(k){var it=I[k],o=Object.assign({},it);
    if(o.dec==="fest"){o.dec="kaufen";o.status=FST[o.status]||"Idee"}

    if(o.her==="Vormieter"&&(o.dec==="mitnehmen"||o.dec==="offen")&&!isPlant(o)){o.dec="uebernehmen";o.status="Zugesagt"}
    delete o.her;

    if(JSON.stringify(o)!==JSON.stringify(it)){I[k]=o;var keep=Object.assign({},o);delete keep.x;delete keep.y;delete keep.rot;st.itemData[k]=keep;n++}});
  if(n){save();render()}}
