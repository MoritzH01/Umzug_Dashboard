<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Umzug Tafel</title>
<meta name="theme-color" content="#f5f2ec">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path d='M9.6 1.8c5.2-.6 8.6 3.1 8.3 8.4-.3 5-3.4 8.3-7.6 8-4.6-.3-8.4-3.4-8.3-8.1.1-4.6 3.2-7.8 7.6-8.3z' fill='%232f4ee0'/></svg>">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Zwei Oberflächen für denselben Plan: Zeichentisch (Transparentpapier, Tusche) und Tafel (Schiefer, Kreide).
   Farben im Plan nach Bauantrag-Konvention: Bestand grau, Neu rot, Abbruch/geht weg gelb gestrichelt. */
:root{
  --bg:#f5f2ec;--grid1:rgba(35,64,200,.05);--grid2:rgba(35,64,200,.10);
  --ink:#1c2a4b;--ink2:#5b6580;--paper:#ffffff;--line:#dedbd2;
  --wall:#1c2a4b;--floor:#ffffff;--floor2:#f7f1e6;--hatch:#9a958a;
  --neu:#e34a2f;--abbruch:#e2b33a;--bestand:#6b7387;--blau:#2f4ee0;--orange:#f28c28;--eiche:#c8995f;
  --steel:linear-gradient(180deg,#f4f5f5,#dfe2e2 55%,#cfd3d3);
  --ui:#f1f2f2;--uiline:#b9bebe;--shadow:0 1px 0 rgba(0,0,0,.05),0 6px 18px rgba(40,35,20,.10);
  --hand:"Courier Prime","Courier New",monospace;--sans:"Inter Tight",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#board{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid1) 1px,transparent 1px),linear-gradient(90deg,var(--grid1) 1px,transparent 1px)}
#board.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.el{position:absolute}
.sel{outline:2px solid var(--blau);outline-offset:3px}

/* Rahmen / Zonen */
.frame{border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 70%,transparent);border-radius:2px}
.fhead{position:absolute;left:-1px;top:-46px;height:42px;display:flex;align-items:baseline;gap:12px;padding:0 2px;background:none;color:var(--ink);font:700 30px var(--sans);letter-spacing:-.025em;text-transform:lowercase;cursor:move;white-space:nowrap;user-select:none}
.fhead small{font:400 13px var(--sans);color:var(--ink2);letter-spacing:0}
.fbody{position:absolute;inset:0;padding:18px;overflow:hidden}

/* Post-its */
.note{width:190px;min-height:170px;padding:18px 14px 14px;font:16px/1.3 var(--hand);color:#1c2a4b;letter-spacing:.01em;box-shadow:0 1px 1px rgba(0,0,0,.08),0 10px 18px -8px rgba(0,0,0,.35);cursor:move;user-select:none}
.note::before{content:"";position:absolute;left:50%;top:-9px;width:68px;height:20px;transform:translateX(-50%) rotate(-2deg);background:rgba(240,235,215,.75);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.note[contenteditable="true"]{cursor:text;user-select:text;outline:2px solid var(--blau)}
.n-gelb{background:#ffe066}.n-rosa{background:#ffadc7}.n-blau{background:#a8d4ff}.n-gruen{background:#bfe8a8}.n-orange{background:#ffb86b}.n-weiss{background:#fbfaf6}
.txt{font:700 36px/1.05 var(--sans);letter-spacing:-.03em;text-transform:lowercase;color:var(--ink);cursor:move;white-space:pre-wrap;min-width:60px;user-select:none}
.txt[contenteditable="true"]{cursor:text;user-select:text;outline:1px dashed var(--blau)}
.img{background:#fff;padding:10px 10px 34px;box-shadow:var(--shadow);cursor:move}
.img img{display:block;width:100%;height:calc(100% );object-fit:cover;pointer-events:none}
.img .cap{position:absolute;left:10px;right:10px;bottom:8px;font:13px var(--hand);color:#1c2a4b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;background:var(--blau);border:2px solid #fff;cursor:nwse-resize;display:none}
.sel .rs,.frame:hover>.rs{display:block}
.x{position:absolute;right:-12px;top:-12px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font:600 13px var(--sans);display:none;line-height:24px;padding:0}
.sel .x{display:block}

/* Planblatt */
.sheet{background:var(--paper);box-shadow:var(--shadow);border:1px solid var(--line)}
.sheet svg{position:absolute;overflow:visible}
.sheet .sheethead{position:absolute;left:0;right:0;top:-34px;height:34px;cursor:move}
.room-floor{fill:var(--floor);cursor:pointer;transition:fill .15s}
.room-floor:hover{fill:var(--floor2)}
.room-floor.out{fill:url(#out)}
.wall{fill:none;stroke:var(--wall);stroke-width:10;stroke-linejoin:miter}
.gap{stroke:var(--floor-solid,#fffdf8);stroke-width:14}
.swing{fill:none;stroke:var(--ink2);stroke-width:1;stroke-dasharray:4 3}
.leaf{stroke:var(--ink);stroke-width:2}
.win{stroke:var(--ink);stroke-width:1.2}
.fixed rect{fill:url(#hatch);stroke:var(--ink2);stroke-width:1}
.rlabel{font:700 16px var(--sans);letter-spacing:-.02em;fill:var(--ink);pointer-events:none}
.rsub{font:400 9px var(--mono);fill:var(--ink2);pointer-events:none}
.rbig{font:700 54px var(--sans);fill:var(--ink);pointer-events:none;letter-spacing:-.035em}
.rbig2{font:500 26px var(--mono);fill:var(--ink2);pointer-events:none}
.dim{stroke:var(--ink2);stroke-width:.8}.dimt{font:400 9px var(--mono);fill:var(--ink2)}
.axis circle{fill:var(--paper);stroke:var(--ink);stroke-width:1}.axis text{font:500 11px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.axis line{stroke:var(--ink2);stroke-width:.6;stroke-dasharray:14 4 2 4}
.furn{cursor:move}
.furn rect.b{stroke-width:1.6}
.furn.bestand rect.b{fill:color-mix(in srgb,var(--bestand) 14%,transparent);stroke:var(--bestand)}
.furn.neu rect.b{fill:color-mix(in srgb,var(--neu) 14%,transparent);stroke:var(--neu)}
.furn.abbruch rect.b{fill:color-mix(in srgb,var(--abbruch) 18%,transparent);stroke:var(--abbruch);stroke-dasharray:6 4}
.furn .d{fill:none;stroke-width:1;opacity:.8}
.furn.bestand .d{stroke:var(--bestand)}.furn.neu .d{stroke:var(--neu)}.furn.abbruch .d{stroke:var(--abbruch)}
.fl{font:500 8px var(--sans);fill:var(--ink);pointer-events:none}
.fl2{font:400 7px var(--mono);fill:var(--ink2);pointer-events:none}
.badge circle{fill:var(--neu)}.badge text{font:700 11px var(--sans);fill:#fff;text-anchor:middle;dominant-baseline:central}

/* Detailstufen */
.l0,.l2{display:none}
body.lod0 .l0{display:inline}body.lod0 .l1{display:none}
body.lod2 .l2{display:inline}
body.lod2 .l2b{display:block}
.l2b,.l0b{display:none}
body.lod0 .l0b{display:flex}
.fsum{position:absolute;inset:0;flex-direction:column;justify-content:center;align-items:center;gap:8px;background:color-mix(in srgb,var(--paper) 88%,transparent);cursor:move;text-align:center}
.fsum span{font:700 80px var(--sans);letter-spacing:-.03em;text-transform:lowercase;color:var(--ink)}
.fsum b{font:700 140px/1 var(--sans);letter-spacing:-.04em;color:var(--blau)}
.rinfo{position:absolute;font:9px/1.3 var(--sans);color:var(--ink);pointer-events:auto;overflow:hidden;background:color-mix(in srgb,var(--paper) 90%,transparent);border:.6px solid var(--line);padding:5px 6px}
.rinfo .ph{display:flex;gap:4px;margin:3px 0 4px}
.rinfo .ph img{width:44px;height:58px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in}
.rinfo b{font-weight:600}
.rinfo ul{margin:2px 0 0;padding-left:10px}
.rinfo button{font:500 8px var(--sans);border:1px solid var(--ink);background:var(--paper);padding:2px 5px;margin-top:4px}

/* Schriftfeld */
.tblock{position:absolute;display:grid;grid-template-columns:1.4fr 1fr 1fr .9fr;border:1.5px solid var(--ink);background:var(--paper);font-family:var(--sans)}
.tblock>div{border-left:1px solid var(--ink);padding:8px 10px;min-height:76px}
.tblock>div:first-child{border-left:0}
.tblock small{display:block;font:500 9px var(--mono);letter-spacing:.08em;text-transform:lowercase;color:var(--ink2)}
.tblock .big{font:700 44px/1 var(--sans);letter-spacing:-.04em;color:var(--blau)}
.tblock .mid{font:600 17px/1.2 var(--sans)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font:10px var(--sans)}
.legend i{display:inline-block;width:14px;height:8px;margin-right:4px;vertical-align:middle;border:1.5px solid}

/* Karten in Zonen */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);padding:10px;font-size:12px;cursor:grab;user-select:none;position:relative}
.card:hover{border-color:var(--eiche)}
.card svg{display:block;width:100%;height:70px;margin-bottom:6px}
.card b{display:block;font-weight:600;line-height:1.2}
.card .m{font:10px var(--mono);color:var(--ink2);margin-top:2px}
.chip{display:inline-block;font:600 9px var(--sans);letter-spacing:.01em;padding:2px 5px;margin-top:6px;border:1.5px solid}
.chip.bestand{border-color:var(--bestand)}.chip.neu{border-color:var(--neu);color:var(--neu)}.chip.abbruch{border-color:var(--abbruch);border-style:dashed}
.card.placed::after{content:"im Plan";position:absolute;right:8px;top:8px;font:500 9px var(--mono);color:var(--blau)}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;height:100%}
.col{border-top:3px solid var(--neu);padding-top:8px;min-width:0}
.col h4{margin:0 0 8px;font:600 12px var(--sans);text-transform:lowercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.col .card{padding:7px 8px;margin-bottom:8px;cursor:default}
.tl{position:absolute;inset:18px}
.tl .ax{position:absolute;right:0;top:34px;border-top:1.5px solid var(--ink)}
.tl .nd{position:absolute;left:0;top:0;bottom:0;width:220px;border-right:1px dashed var(--line);padding-right:12px;overflow:auto}
.tl .nd h5{margin:0 0 10px;font:700 18px var(--sans);letter-spacing:-.02em}
.tl .nd .tag{position:static;display:block;margin-bottom:6px;max-width:none}
.tl .tag{cursor:grab}
.tl .tag.nt{border-left-width:6px;border-left-color:rgba(28,42,75,.25);font-family:var(--hand)}
.tl .tick.wk{height:6px;top:31px;opacity:.5}
.tlh{font:12px var(--sans);color:var(--ink2);margin:8px 0 0}
.tlh2{position:absolute;right:0;bottom:0;margin:0}
.note .due{position:absolute;right:8px;bottom:6px;font:700 11px var(--sans);background:var(--ink);color:#fff;padding:2px 6px;border-radius:9px;cursor:pointer}
.tl .mo{position:absolute;top:8px;font:600 12px var(--mono);text-transform:lowercase}
.tl .tick{position:absolute;top:28px;height:12px;border-left:1px solid var(--ink)}
.tl .tag{position:absolute;max-width:170px;padding:5px 7px;font:12px/1.2 var(--sans);background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--eiche);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .tag.done{opacity:.45;text-decoration:line-through}
.tl .tag.late{border-left-color:var(--neu)}
.tl .mv{position:absolute;top:0;bottom:0;border-left:3px solid var(--neu)}
.tl .mv span,.tl .td span{position:absolute;top:-24px;left:6px;font:700 12px var(--sans);color:var(--neu);white-space:nowrap}
.tl .td{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--blau)}
.tl .td span{color:var(--blau)}
.now li{margin:0 0 8px;font-size:15px}
.now li span{font:500 11px var(--mono);color:var(--ink2);margin-right:6px}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.money div{border-top:3px solid var(--eiche);padding-top:6px}
.money b{display:block;font:800 34px var(--sans)}
.money small{font:11px var(--mono);color:var(--ink2)}

/* Bedienung */
.ui{position:fixed;z-index:20;background:rgba(251,249,244,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #e3ddd0;border-radius:14px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 12px 32px -14px rgba(28,42,75,.28);display:flex;align-items:center;gap:2px;padding:6px}
.ui button{border:0;background:transparent;padding:8px 12px;font:500 14px var(--sans);letter-spacing:-.01em;color:var(--ink);border-radius:9px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.ui button svg{width:16px;height:16px;flex:none}
.ui button:hover{background:#efe9dd}
.ui button.on{background:var(--ink);color:#fff}
.ui .sep{width:1px;height:22px;background:#e3ddd0;margin:0 6px;flex:none}
.ui .grow{flex:1}
#bar{left:16px;right:16px;top:14px;height:54px}
.logo{display:flex;align-items:center;gap:5px;font:700 23px var(--sans);letter-spacing:-.05em;color:var(--ink);padding:0 6px 3px 10px}
.logo svg{width:15px;height:15px;margin-top:6px}
.sws{display:flex;gap:0;margin-right:4px}
.sws button{padding:6px 5px}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid rgba(28,42,75,.18);display:inline-block}
.sws button.on{background:transparent}.sws button.on .sw{box-shadow:0 0 0 2px #fbf9f4,0 0 0 3.5px var(--ink)}
#lodtag{font:500 12px var(--sans);color:var(--ink2);padding-right:10px}
.navl{font:500 14px var(--sans);color:var(--ink);text-decoration:none;padding:8px 12px;border-radius:9px}.navl:hover{background:#efe9dd}
.acct{font:12px var(--sans);color:var(--ink2);padding:0 8px}.acct a{color:inherit}
#zoom{right:16px;bottom:16px}
#zoom #zl{font:500 12px var(--mono);min-width:48px;text-align:center}
#mini{position:fixed;right:16px;bottom:80px;z-index:20;width:200px;height:132px;background:#fbf9f4;border:1px solid #e3ddd0;border-radius:12px;box-shadow:var(--shadow);cursor:pointer}
#hint{position:fixed;left:16px;bottom:16px;z-index:20;font:12px var(--sans);color:var(--ink2);max-width:46ch;line-height:1.4}
#ghost{position:fixed;z-index:40;pointer-events:none;opacity:.92}
#ghost[data-label]::after{content:attr(data-label);display:block;font:700 11px var(--sans);color:var(--blau);margin-top:3px}
#rb{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);z-index:30;background:var(--ui);border-left:1px solid var(--uiline);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .25s ease;overflow:auto;padding:22px}
#rb.open{transform:none}
#rb h2{margin:0;font:700 34px var(--sans);letter-spacing:-.03em;text-transform:lowercase}
#rb .meta{font:12px var(--mono);color:var(--ink2);margin:4px 0 14px}
#rb .phs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#rb .phs img{width:100%;aspect-ratio:3/4;object-fit:cover;cursor:zoom-in}
#rb h3{font:600 11px var(--sans);letter-spacing:.08em;text-transform:lowercase;margin:18px 0 6px;color:var(--ink2)}
#rb ul{margin:0;padding-left:18px;line-height:1.5;font-size:14px}
#rb .close{position:absolute;right:14px;top:14px;border:1px solid var(--uiline);background:transparent;padding:6px 10px}
#lb{position:fixed;inset:0;z-index:50;background:rgba(15,15,15,.88);display:none;place-items:center}
#lb.open{display:grid}
#lb img{max-width:92vw;max-height:88vh}
#modal .bg{position:fixed;inset:0;z-index:45;background:rgba(28,42,75,.28);display:grid;place-items:center;padding:16px}
#modal form{background:#fbf9f4;border:1px solid #e3ddd0;border-radius:16px;box-shadow:0 24px 60px -20px rgba(28,42,75,.45);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:grid;gap:14px;color:var(--ink)}
#modal h2{margin:0;font:700 28px var(--sans);letter-spacing:-.035em}
#modal label{display:grid;gap:5px;font:500 12px var(--sans);color:var(--ink2)}
#modal input,#modal select{font:15px var(--sans);color:var(--ink);padding:9px 11px;border:1px solid #d9d2c3;border-radius:9px;background:#fff;width:100%}
#modal input:focus,#modal select:focus{outline:2px solid var(--blau);outline-offset:0;border-color:transparent}
#modal .row{display:flex;gap:10px;align-items:end}
#modal .row>*{flex:1}
#modal .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#modal .ph{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
#modal .ph .box{width:120px;height:120px;border:1px dashed #cfc7b6;border-radius:10px;background:#fff center/cover no-repeat;display:grid;place-items:center;font:12px var(--sans);color:var(--ink2);text-align:center;padding:8px}
#modal .note2{font:13px/1.45 var(--sans);color:var(--ink2);margin:0}
#modal .btn{border:0;border-radius:10px;padding:10px 16px;font:600 14px var(--sans);background:var(--ink);color:#fff;flex:0 0 auto}
#modal .btn.ghost{background:transparent;color:var(--ink);border:1px solid #d9d2c3}
#modal .btn.del{background:transparent;color:var(--neu);border:1px solid currentColor}
#modal .foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#modal .foot .del{margin-right:auto}
.card img.pic{display:block;width:100%;height:70px;object-fit:contain;margin-bottom:6px;background:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;font-size:13px;display:none}
@media (max-width:760px){
  #bar{overflow-x:auto;overflow-y:hidden}
  #bar .lab,#lodtag,#zoom [data-z="plan"],#zoom [data-z="input"],#zoom .sep{display:none}
  #mini,#hint{display:none}
}
</style>

<div id="board"><div id="world"></div></div>

<header class="ui" id="bar">
  <span class="logo">umzug<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M9.6 1.8c5.2-.6 8.6 3.1 8.3 8.4-.3 5-3.4 8.3-7.6 8-4.6-.3-8.4-3.4-8.3-8.1.1-4.6 3.2-7.8 7.6-8.3z" fill="#2f4ee0"/></svg></span>
  <span class="sep"></span>
  <button data-add="moebel"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 7.5v5h12v-5"/><path d="M4 7.5V4.5h8v3"/><path d="M2 7.5h2.5v2.5h7V7.5H14"/></svg><span class="lab">möbel</span></button>
  <button data-add="note"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 2.5h11v7l-4 4h-7z"/><path d="M13.5 9.5h-4v4"/></svg><span class="lab">post-it</span></button>
  <span class="sws"><button data-color="gelb" title="Gelb"><span class="sw n-gelb"></span></button><button data-color="rosa" title="Rosa"><span class="sw n-rosa"></span></button><button data-color="blau" title="Blau"><span class="sw n-blau"></span></button><button data-color="gruen" title="Grün"><span class="sw n-gruen"></span></button></span>
  <button data-add="text"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3.5h10M8 3.5v10"/></svg><span class="lab">text</span></button>
  <button data-add="img"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M2.5 11.5l3.5-3.5 3 3 2-2 2.5 2.5"/><circle cx="10.5" cy="6" r="1"/></svg><span class="lab">bild</span></button>
  <button data-add="frame"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.5 2"><rect x="2" y="2.5" width="12" height="11"/></svg><span class="lab">rahmen</span></button>
  <span class="grow"></span>
  <span id="lodtag"></span>
  <a class="navl" id="to-list" href="liste.html" hidden>liste</a>
  <span class="acct" id="acct" hidden></span>
</header>
<div class="ui" id="zoom">
  <button data-z="out" aria-label="Verkleinern">−</button><span id="zl">100%</span><button data-z="in" aria-label="Vergrößern">+</button>
  <span class="sep"></span><button data-z="plan">grundriss</button><button data-z="all">alles</button>

function bounds(){if(!Object.keys(R).length)return {x:0,y:0,w:800,h:800};var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;rooms().forEach(function(r){x0=Math.min(x0,r.x);y0=Math.min(y0,r.y);x1=Math.max(x1,r.x+r.w);y1=Math.max(y1,r.y+r.h)});return {x:x0,y:y0,w:x1-x0,h:y1-y0}}

function tasksFor(rid){var r=R[rid];return Object.keys(T).map(function(k){return Object.assign({id:k},T[k])}).filter(function(t){return !t.done&&(t.raum===rid||(r&&t.raum===r.name))})}

  Object.keys(I).forEach(function(id){var it=I[id];if(it.dec!=="verkaufen")return;(m[it.status]||m["Fotos machen"]).push(it)});
  return '<div class="pipe">'+cols.map(function(c){return '<div class="col"><h4>'+c+'<span>'+m[c].length+'</span></h4>'+m[c].map(function(it){return '<div class="card"><b>'+esc((it.name||"").split(/[,(]/)[0])+'</b><div class="m">'+(it.preis?it.preis+" €":"Preis fehlt")+'</div></div>'}).join("")+'</div>'}).join("")+'</div>'}
var TL0=pd("2026-10-12"),TL1=pd("2027-01-10"),TLL=240;
function tlW(f){return Math.max(300,f.w-36-TLL)}
function tlX(f,d){return TLL+(d-TL0)/864e5/((TL1-TL0)/864e5)*tlW(f)}
function tlDate(f,x){var n=Math.round((x-TLL)/tlW(f)*((TL1-TL0)/864e5)),d=new Date(TL0);d.setDate(d.getDate()+n);return isoD(d)}
function isoD(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmtD(s){var d=pd(s);return d?String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+".":""}
function tasksAll(){return Object.keys(T).map(function(k){return Object.assign({id:k},T[k])})}

  tasksAll().filter(function(t){return !t.due&&!t.done}).forEach(function(t){s+='<div class="tag nd-t" data-task="'+t.id+'" title="'+esc(t.title)+'">'+esc(t.title||"Ohne Titel")+'</div>'});
  s+='<p class="tlh">Zum Planen auf die Leiste ziehen.</p></div><div class="ax" style="left:'+TLL+'px"></div>';
  for(var d=new Date(TL0);d<=TL1;d.setDate(d.getDate()+1)){var x=tlX(f,d);if(d.getDate()===1)s+='<div class="mo" style="left:'+x+'px">'+MON[d.getMonth()].toLowerCase()+' '+String(d.getFullYear()).slice(2)+'</div><div class="tick" style="left:'+x+'px"></div>';else if(d.getDay()===1)s+='<div class="tick wk" style="left:'+x+'px"></div>'}
  s+='<div class="td" style="left:'+tlX(f,today())+'px"><span>heute</span></div><div class="mv" style="left:'+tlX(f,pd(MOVE))+'px"><span>umzug 15.12.</span></div>';
  var rows=tasksAll().filter(function(t){return t.due}).map(function(t){return {k:"t",o:t,d:t.due}});
  st.els.forEach(function(e){if(e.type!=="note"||!e.due)return;var lx=e.x-f.x,ly=e.y-f.y;if(lx>0&&lx<f.w&&ly>-60&&ly<f.h)return;rows.push({k:"n",o:e,d:e.due})});
  var lanes=[];rows.sort(function(x,y){return x.d<y.d?-1:1}).forEach(function(r){var x=tlX(f,pd(r.d)),l=0;while(lanes[l]!=null&&lanes[l]>x-4)l++;lanes[l]=x+176;
    if(r.k==="t"){var t=r.o;s+='<div class="tag'+(t.done?' done':'')+(!t.done&&days(t.due)<0?' late':'')+'" data-task="'+t.id+'" style="left:'+x+'px;top:'+(52+l*34)+'px" title="'+esc(t.title)+' · '+fmtD(t.due)+'">'+esc(t.title||"Ohne Titel")+'</div>'}
    else s+='<div class="tag nt n-'+(r.o.color||"gelb")+'" data-tnote="'+r.o.id+'" style="left:'+x+'px;top:'+(52+l*34)+'px" title="Post-it · '+fmtD(r.d)+'">'+esc((r.o.text||"Post-it").split("\n")[0])+'</div>'});
  return s+'<p class="tlh tlh2">Doppelklick auf die Leiste legt einen Eintrag an. Einträge und Post-its lassen sich auf ein Datum ziehen.</p></div>'}
function nowHTML(){var d=days(MOVE),open=Object.keys(T).map(function(k){return T[k]}).filter(function(t){return !t.done&&t.due}).sort(function(a,b){return a.due<b.due?-1:1}).slice(0,5);
  return '<div style="display:grid;grid-template-columns:220px 1fr;gap:28px;height:100%"><div><div style="font:800 110px/0.9 var(--sans);color:var(--neu);letter-spacing:-.04em" class="cdn">'+d+'</div><div style="font:500 13px var(--mono);margin-top:10px">Tage bis zum Umzug am 15.12.</div></div><ol class="now" style="margin:0;padding-left:20px">'+open.map(function(t){var dd=pd(t.due);return '<li><span>'+String(dd.getDate()).padStart(2,"0")+'.'+String(dd.getMonth()+1).padStart(2,"0")+'.</span>'+esc(t.title)+'</li>'}).join("")+'</ol></div>'}
function geldHTML(){var aus=0,ein=0;Object.keys(I).forEach(function(k){var it=I[k];if((it.dec==="kaufen"||it.dec==="fest")&&it.preis)aus+=+it.preis;if(it.dec==="verkaufen"&&it.preis)ein+=+it.preis});

function frameDiv(id,title,sub,f,inner,sum){return '<div class="el frame" data-frame="'+id+'" style="left:'+f.x+'px;top:'+f.y+'px;width:'+f.w+'px;height:'+f.h+'px"><div class="fhead" data-fdrag="'+id+'">'+esc(title)+(sub?' <small>'+esc(sub)+'</small>':'')+'</div><div class="fbody">'+inner+'</div>'+(sum!=null?'<div class="fsum l0b" data-fdrag="'+id+'"><span>'+esc(title)+'</span><b>'+sum+'</b></div>':'')+(id!=="plan"?'<div class="rs" data-fres="'+id+'"></div>':'')+(id.indexOf("u")===0?'<button class="x" data-fdel="'+id+'">×</button>':'')+'</div>'}

  var pf=F.plan,sw=PB.w+2*PAD+70,sh=PB.h+2*PAD+70+120;
  s+='<div class="el sheet" style="left:'+pf.x+'px;top:'+pf.y+'px;width:'+sw+'px;height:'+sh+'px"><div class="fhead sheethead" data-fdrag="plan" style="left:-1px;top:-34px">Grundriss · neue Wohnung <small>M 1:100 · Blatt 01</small></div>'+
    '<svg style="left:'+(PAD+70-PB.x)+'px;top:'+(PAD+70-PB.y)+'px" width="'+PB.w+'" height="'+PB.h+'" viewBox="'+PB.x+' '+PB.y+' '+PB.w+' '+PB.h+'" id="plansvg">'+planSVG()+'</svg>'+
    '<div style="position:absolute;left:'+(PAD+70-PB.x)+'px;top:'+(PAD+70-PB.y)+'px">'+roomInfo()+'</div>'+
    titleBlock(sw,sh)+'</div>';
  var openT=Object.keys(T).filter(function(k){return !T[k].done}).length,sell=Object.keys(I).filter(function(k){return I[k].dec==="verkaufen"&&["Verkauft","Abgeholt"].indexOf(I[k].status)<0}).length,placedN=Object.keys(I).filter(function(k){return I[k].x!=null&&I[k].x!==""}).length;
  s+=frameDiv("now","Jetzt dran","",F.now,nowHTML(),days(MOVE)+" Tage");
  s+=frameDiv("moebel","Möbel","in einen Raum ziehen",F.moebel,moebelHTML(),placedN+" / "+Object.keys(I).length+" im Plan");
  s+=frameDiv("verkauf","Verkauf","Kleinanzeigen",F.verkauf,verkaufHTML(),sell+" offen");
  s+=frameDiv("zeit","Zeitplan","Okt bis Jan",F.zeit,zeitHTML(F.zeit),openT+" Aufgaben offen");
  s+=frameDiv("mood","Moodboard","Bilder reinziehen oder einfügen",F.mood,"",null);
  s+=frameDiv("geld","Geld","",F.geld,geldHTML(),null);
  Object.keys(F.user||{}).forEach(function(id){var f=F.user[id];s+=frameDiv(id,f.title||"Rahmen","",f,"")});
  st.els.forEach(function(e){s+=elHTML(e)});
  world.innerHTML=s;applyView();}
function titleBlock(sw,sh){var d=days(MOVE),area=rooms().filter(function(r){return !r.outdoor}).reduce(function(a,r){return a+r.w*r.h/1e4},0);

  '<div><small>Projekt</small><div class="mid">Umzug Altbau</div><div class="legend"><span><i style="border-color:var(--bestand)"></i>Bestand</span><span><i style="border-color:var(--neu)"></i>Neu</span><span><i style="border-color:var(--abbruch);border-style:dashed"></i>Geht weg</span></div></div>'+
  '<div><small>Einzug</small><div class="mid">Di, 15.12.2026</div><small style="margin-top:6px">Wohnfläche ca.</small><div class="mid">'+area.toFixed(1).replace(".",",")+' m²</div></div>'+
  '<div><small>Noch</small><div class="big">'+d+'</div><small>Tage</small></div>'+
  '<div style="display:flex;flex-direction:column;justify-content:space-between"><small>Maßstab / Nord</small><svg width="110" height="44" viewBox="0 0 110 44"><g fill="none" stroke="var(--ink)" stroke-width="1"><rect x="0" y="30" width="100" height="5"/><rect x="0" y="30" width="50" height="5" fill="var(--ink)"/></g><text x="0" y="26" font-size="9" font-family="IBM Plex Mono" fill="var(--ink)">0</text><text x="88" y="26" font-size="9" font-family="IBM Plex Mono" fill="var(--ink)">1 m</text><g transform="translate(92,10)"><path d="M0 -10 L6 8 L0 4 L-6 8Z" fill="var(--ink)"/><text y="-12" font-size="9" text-anchor="middle" font-family="Archivo" font-weight="700" fill="var(--ink)">N</text></g></svg></div></div>'}
function elHTML(e){var c=e.id===selId?" sel":"";
  if(e.type==="note")return '<div class="el note n-'+(e.color||"gelb")+c+'" data-el="'+e.id+'" style="left:'+e.x+'px;top:'+e.y+'px;transform:rotate('+rot(e.id)+'deg)">'+esc(e.text)+(e.due?'<span class="due" data-undue="'+e.id+'" title="Datum entfernen">'+fmtD(e.due)+' ×</span>':'')+'<button class="x" data-del="'+e.id+'">×</button></div>';
  if(e.type==="text")return '<div class="el txt'+c+'" data-el="'+e.id+'" style="left:'+e.x+'px;top:'+e.y+'px">'+esc(e.text)+'<button class="x" data-del="'+e.id+'">×</button></div>';
  if(e.type==="img")return '<div class="el img'+c+'" data-el="'+e.id+'" style="left:'+e.x+'px;top:'+e.y+'px;width:'+e.w+'px;height:'+e.h+'px;transform:rotate('+rot(e.id)/2+'deg)"><img src="'+e.src+'" alt="" style="height:calc(100% - 24px)"><div class="cap">'+esc(e.text||"")+'</div><div class="rs" data-res="'+e.id+'"></div><button class="x" data-del="'+e.id+'">×</button></div>';
  return ""}
function rot(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))|0;return ((h%5)+5)%5-2}

/* ---------- Ansicht ---------- */
function applyView(){world.style.transform="translate("+V.x+"px,"+V.y+"px) scale("+V.k+")";
  var g1=20*V.k,g2=100*V.k,bp=V.x+"px "+V.y+"px";
  var layers=document.body.dataset.skin==="tafel"?["auto","auto",g2,g2,g1,g1]:[g2,g2,g1,g1];
  board.style.backgroundSize=layers.map(function(v){return v==="auto"?"100% 100%":v+"px "+v+"px"}).join(",");
  board.style.backgroundPosition=layers.map(function(v){return v==="auto"?"0 0":bp}).join(",");
  var lod=V.k<.42?0:V.k<1.3?1:2;document.body.classList.toggle("lod0",lod===0);document.body.classList.toggle("lod2",lod===2);
  $("#lodtag").textContent=["übersicht","plan","raumdetails"][lod];
  $("#zl").textContent=Math.round(V.k*100)+"%";st.view={x:V.x,y:V.y,k:V.k};save();drawMini()}
function zoomAt(sx,sy,f){var k=Math.max(.08,Math.min(4,V.k*f));var wx=(sx-V.x)/V.k,wy=(sy-V.y)/V.k;V.k=k;V.x=sx-wx*k;V.y=sy-wy*k;applyView()}
function fit(b,pad){var W=innerWidth,H=innerHeight,k=Math.min((W-pad*2)/b.w,(H-pad*2-60)/b.h,2.5);V.k=k;V.x=W/2-(b.x+b.w/2)*k;V.y=(H+40)/2-(b.y+b.h/2)*k;applyView()}
function planBox(){var f=st.frames.plan;return {x:f.x,y:f.y,w:PB.w+2*PAD+70,h:PB.h+2*PAD+190}}
function allBox(){var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,add=function(x,y,w,h){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x+w);y1=Math.max(y1,y+h)};
  var pb=planBox();add(pb.x,pb.y-40,pb.w,pb.h+40);["now","moebel","verkauf","zeit","mood","geld"].forEach(function(k){var f=st.frames[k];add(f.x,f.y-44,f.w,f.h+44)});
  Object.keys(st.frames.user).forEach(function(k){var f=st.frames.user[k];add(f.x,f.y,f.w,f.h)});st.els.forEach(function(e){add(e.x,e.y,e.w||190,e.h||170)});return {x:x0,y:y0,w:x1-x0,h:y1-y0}}
function toWorld(sx,sy){return {x:(sx-V.x)/V.k,y:(sy-V.y)/V.k}}

/* ---------- Übersichtskarte ---------- */
function drawMini(){var c=$("#mini");if(!c||getComputedStyle(c).display==="none")return;var g=c.getContext("2d"),b=allBox(),W=c.width,H=c.height,k=Math.min(W/b.w,H/b.h)*.9,ox=(W-b.w*k)/2-b.x*k,oy=(H-b.h*k)/2-b.y*k;
  var cs=getComputedStyle(document.body);g.clearRect(0,0,W,H);g.fillStyle=cs.getPropertyValue("--ink2");g.globalAlpha=.25;
  ["now","moebel","verkauf","zeit","mood","geld"].forEach(function(n){var f=st.frames[n];g.fillRect(ox+f.x*k,oy+f.y*k,f.w*k,f.h*k)});
  g.globalAlpha=.6;var pb=planBox();g.fillRect(ox+pb.x*k,oy+pb.y*k,pb.w*k,pb.h*k);
  g.globalAlpha=1;st.els.forEach(function(e){g.fillStyle=e.type==="note"?"#f2c94c":cs.getPropertyValue("--ink2");g.fillRect(ox+e.x*k,oy+e.y*k,(e.w||190)*k,(e.h||170)*k)});
  g.strokeStyle=cs.getPropertyValue("--neu");g.lineWidth=3;var tl=toWorld(0,0),br=toWorld(innerWidth,innerHeight);g.strokeRect(ox+tl.x*k,oy+tl.y*k,(br.x-tl.x)*k,(br.y-tl.y)*k);
  drawMini.m={k:k,ox:ox,oy:oy}}
$("#mini").addEventListener("click",function(e){var r=this.getBoundingClientRect(),m=drawMini.m;if(!m)return;var mx=(e.clientX-r.left)*(this.width/r.width),my=(e.clientY-r.top)*(this.height/r.height);var wx=(mx-m.ox)/m.k,wy=(my-m.oy)/m.k;V.x=innerWidth/2-wx*V.k;V.y=innerHeight/2-wy*V.k;applyView()});

/* ---------- Elemente ---------- */
function newId(){return "e"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function getEl(id){return st.els.filter(function(e){return e.id===id})[0]}
function addNote(x,y,edit){var e={id:newId(),type:"note",x:Math.round(x-95),y:Math.round(y-85),color:st.color,text:""};st.els.push(e);selId=e.id;save();render();if(edit!==false)editEl(e.id)}
function addText(x,y){var e={id:newId(),type:"text",x:Math.round(x),y:Math.round(y),text:"Text"};st.els.push(e);selId=e.id;save();render();editEl(e.id)}
function addImg(src,x,y,cap){var im=new Image();im.onload=function(){var w=280,h=Math.round(w*im.height/im.width)+34;var e={id:newId(),type:"img",x:Math.round(x-w/2),y:Math.round(y-h/2),w:w,h:h,src:src,text:cap||""};st.els.push(e);selId=e.id;save();render()};im.src=src}
function editEl(id){var d=world.querySelector('[data-el="'+id+'"]');if(!d)return;var x=d.querySelector(".x");if(x)x.remove();d.contentEditable="true";d.focus();var sel=getSelection(),r=document.createRange();r.selectNodeContents(d);r.collapse(false);sel.removeAllRanges();sel.addRange(r);
  d.addEventListener("blur",function fin(){d.removeEventListener("blur",fin);var e=getEl(id);if(e){e.text=d.innerText.trim();if(!e.text&&e.type!=="img"){st.els=st.els.filter(function(z){return z.id!==id})}}save();render()})}
function shrink(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.78))};im.src=r.result};r.readAsDataURL(file)}
function center(){return toWorld(innerWidth/2,innerHeight/2)}

/* ---------- Zeiger ---------- */
var drag=null,pts={},pinch=null,moved=false;
board.addEventListener("pointerdown",function(e){if(e.target.closest('[contenteditable="true"]'))return;
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  if(Object.keys(pts).length===2){var p=Object.values(pts);pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2};drag=null;return}
  moved=false;var t=e.target,w=toWorld(e.clientX,e.clientY);

  else if(t.closest("[data-task]")){drag={kind:"task",id:t.closest("[data-task]").dataset.task,sx:e.clientX,sy:e.clientY}}

  else if(t.closest("[data-el]")){var id=t.closest("[data-el]").dataset.el,el2=getEl(id);drag={kind:"el",el:el2,ox:w.x-el2.x,oy:w.y-el2.y,node:t.closest("[data-el]")};if(selId!==id){selId=id;world.querySelectorAll(".sel").forEach(function(n){n.classList.remove("sel")});drag.node.classList.add("sel")}}

  else if(t.closest("[data-furn]")){var fid2=t.closest("[data-furn]").dataset.furn,it=I[fid2];drag={kind:"furn",id:fid2,ox:w.x-(+it.x),oy:w.y-(+it.y),node:t.closest("[data-furn]")}}
  else if(t.closest("[data-card]")){drag={kind:"card",id:t.closest("[data-card]").dataset.card,sx:e.clientX,sy:e.clientY}}
  else{drag={kind:"pan",sx:e.clientX,sy:e.clientY,vx:V.x,vy:V.y,room:t.closest("[data-room]")};board.classList.add("panning");if(selId){selId=null;world.querySelectorAll(".sel").forEach(function(n){n.classList.remove("sel")})}}
  board.setPointerCapture(e.pointerId)});
board.addEventListener("pointermove",function(e){if(pts[e.pointerId])pts[e.pointerId]={x:e.clientX,y:e.clientY};
  if(pinch&&Object.keys(pts).length===2){var p=Object.values(pts),d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),cx=(p[0].x+p[1].x)/2,cy=(p[0].y+p[1].y)/2;V.x+=cx-pinch.cx;V.y+=cy-pinch.cy;zoomAt(cx,cy,d/pinch.d);pinch={d:d,cx:cx,cy:cy};return}
  if(!drag)return;var w=toWorld(e.clientX,e.clientY);

  '<h3>Möbel hier</h3>'+(its.length?'<ul>'+its.map(function(i){return '<li>'+esc(i.name)+' <span style="color:var(--ink2);font:11px var(--mono)">'+i.w+'×'+i.d+'</span></li>'}).join("")+'</ul>':'<p style="font-size:14px;color:var(--ink2)">Noch leer. Zieh eine Möbelkarte hier rein.</p>')+
  '<h3>Aufgaben</h3>'+(ts.length?'<ul>'+ts.map(function(t){return '<li>'+esc(t.title)+'</li>'}).join("")+'</ul>':'<p style="font-size:14px;color:var(--ink2)">Keine offenen Aufgaben für diesen Raum.</p>');
  $("#rb").classList.add("open")}

function syncTop(){$("#inp").textContent=st.input==="maus"?"maus":"touchpad";document.querySelectorAll("[data-color]").forEach(function(b){b.classList.toggle("on",b.dataset.color===st.color)})}
var sv=st.view;document.body.dataset.skin=st.skin;syncTop();render();snap();
if(sv){V=sv;applyView()}else fit(planBox(),40);
};
if(!window.TAFEL_DEFER)window.startTafel();
</script>

<script>
(function(){
var CFG=window.UMZUG_CONFIG||{},$=function(q){return document.querySelector(q)};
if(!CFG.supabaseUrl||!window.supabase){document.getElementById("modal").innerHTML='<div class="bg"><form><h2>keine datenbank</h2><p class="note2">In config.js fehlt der Supabase-Zugang.</p></form></div>';return}
var sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),started=false;
function msg(t){var m=$("#lg-msg");if(m)m.textContent=t}
function login(){$("#modal").innerHTML='<div class="bg"><form id="lg"><h2>anmelden</h2><label>Mail-Adresse<input type="email" id="lg-mail" autocomplete="email" required></label><label>Passwort<input type="password" id="lg-pw" autocomplete="current-password"></label><div class="foot"><button class="btn">Anmelden</button></div><p class="note2">Kein Passwort oder vergessen? <a href="#" id="lg-link">Link per Mail schicken</a>.</p><p class="note2" id="lg-msg"></p></form></div>';
  $("#lg").addEventListener("submit",function(e){e.preventDefault();var pw=$("#lg-pw").value;if(!pw){msg("Bitte Passwort eingeben oder einen Link schicken lassen.");return}msg("Melde an …");
    sb.auth.signInWithPassword({email:$("#lg-mail").value.trim(),password:pw}).then(function(r){if(r.error)msg(/invalid/i.test(r.error.message)?"Mail oder Passwort stimmt nicht.":"Das hat nicht geklappt: "+r.error.message)})});
  $("#lg-link").addEventListener("click",function(e){e.preventDefault();var m=$("#lg-mail").value.trim();if(!m){msg("Bitte zuerst die Mail-Adresse eingeben.");return}
    sb.auth.signInWithOtp({email:m,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}}).then(function(r){msg(r.error?(/database error|nicht erlaubt|not allowed/i.test(r.error.message)?"Diese Adresse ist nicht freigegeben.":"Das hat nicht geklappt: "+r.error.message):"Schau in dein Postfach und tipp auf den Link.")})})}
function toast(t){var e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},3000)}
function load(session){if(started)return;started=true;$("#modal").innerHTML='<div class="bg"><form><h2>lade tafel …</h2></form></div>';
  sb.from("docs").select("coll,id,data").then(function(r){if(r.error){$("#modal").innerHTML='<div class="bg"><form><h2>datenbank antwortet nicht</h2><p class="note2">'+r.error.message+'</p></form></div>';return}
    var S={rooms:{},items:{},tasks:{},plan:null,board:[],layout:null};
    r.data.forEach(function(x){if(x.coll==="rooms"||x.coll==="items"||x.coll==="tasks")S[x.coll][x.id]=x.data;else if(x.coll==="board")S.board.push(x.data);else if(x.coll==="meta"&&x.id==="plan")S.plan=x.data;else if(x.coll==="meta"&&x.id==="board")S.layout=x.data});
    window.SEED=S;
    window.TAFEL_STORE={
      put:function(c,id,data){return sb.from("docs").upsert({coll:c,id:id,data:data,updated_at:new Date().toISOString()}).then(function(x){if(x.error)toast("Speichern hat nicht geklappt: "+x.error.message)})},
      del:function(c,id){return sb.from("docs").delete().eq("coll",c).eq("id",id).then(function(x){if(x.error)toast("Löschen hat nicht geklappt.")})}};
    window.UMZUG_LINK_FN=function(url){return sb.functions.invoke("produkt",{body:{url:url}}).then(function(x){if(x.error||!x.data||x.data.error)throw x.error||x.data.error;return x.data})};
    $("#modal").innerHTML="";window.startTafel();
    var acct=$("#acct");acct.hidden=false;acct.innerHTML=(session.user.email||"")+' · <a href="#" id="logout">abmelden</a>';$("#to-list").hidden=false;
    $("#logout").onclick=function(e){e.preventDefault();sb.auth.signOut().then(function(){location.reload()})};
    if(!Object.keys(S.rooms).length)toast("Noch keine Daten. In der Liste unter Daten kannst du deinen Export importieren.");
    sb.channel("tafel").on("postgres_changes",{event:"*",schema:"public",table:"docs"},function(p){var row=p.eventType==="DELETE"?p.old:p.new;if(row&&row.coll)window.TAFEL_APPLY(row.coll,row.id,p.eventType==="DELETE"?null:row.data)}).subscribe();
  })}
sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(s)load(s);else login()});
sb.auth.onAuthStateChange(function(ev,s){if(s&&!started)load(s)});
})();
</script>
</body></html>
